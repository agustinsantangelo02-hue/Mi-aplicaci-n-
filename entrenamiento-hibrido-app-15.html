 belleza:{t:'Belleza y cuidado personal',i:'Hábitos simples y gratuitos. Sin ideales físicos irreales ni compras innecesarias.',nota:'Consejos educativos, no diagnósticos. Si tenés una afección de piel que te preocupa, consultá a un profesional de salud.',items:BELLEZA},
 carisma:{t:'Carisma y habilidades sociales',i:'Se aprenden con práctica, sin fingir ser otra persona. Ser introvertido no es peor ni mejor.',nota:'Sin estudios citados: estos ejercicios son consejos generales de práctica, no resultados científicos.',items:[
  {g:'Conversar',t:'Escucha activa',ev:'General',q:'Escuchar bien es prestar atención y mostrarlo con preguntas y gestos.',a:'En cada charla, hacé una pregunta de seguimiento sobre lo que dijo la otra persona.',r:'Charlas más cómodas y que la gente se sienta escuchada.',l:'Es práctica, no una fórmula.',s:null},
  {g:'Conversar',t:'Iniciar una conversación',ev:'General',q:'Empezar con algo simple del lugar o de la actividad reduce la presión.',a:'Desafío de 7 días: saludá y hacé una pregunta simple a 1 persona por día (escuela o iglesia).',r:'Más soltura con el tiempo. No esperes que todas las charlas salgan bien.',l:'Cada persona avanza a su ritmo.',s:null},
  {g:'Hablar en público',t:'Hablar frente a un grupo',ev:'General',q:'Se mejora de a poco, con situaciones cada vez más grandes.',a:'Contá algo de 1 minuto a un familiar; luego a 3 personas; después en un grupo.',r:'Más confianza con la práctica repetida.',l:'Es normal sentir nervios.',s:null},
  {g:'Hablar en público',t:'Contar historias y humor',ev:'General',q:'Una historia corta con inicio, problema y final se entiende y se recuerda mejor.',a:'Contá 1 anécdota de 3 frases a alguien de confianza.',r:'Más facilidad para entretener sin forzar.',l:'El humor depende de cada grupo; respetá siempre a los demás.',s:null},
  {g:'Conflictos y desacuerdos',t:'Decir que no con respeto',ev:'General',q:'Poder decir que no, o disentir sin pelear, es una habilidad social. Un «no» claro y amable suele ser mejor que un «sí» forzado.',a:'Practicá una frase: «Gracias por pensar en mí; esta vez no puedo, pero…».',r:'Menos compromisos forzados y más respeto mutuo.',l:'No hace falta dar explicaciones largas. Si hay presión o intimidación, pedí ayuda a un adulto.',s:null},
  {g:'Conflictos y desacuerdos',t:'Cuando alguien no está de acuerdo con vos',ev:'General',q:'Mantener la calma y buscar lo que tienen en común hace que la conversación siga siendo cómoda.',a:'Decí «Entiendo tu punto. Yo lo veo distinto porque…» y cambiá de tema si la charla se pone tensa.',r:'Conversaciones menos incómodas.',l:'No hace falta ganar cada discusión.',s:null},
  {g:'Mirada cristiana y no cristiana',t:'Escuchar primero: dos miradas',ev:'Comparación',kw:'escuchar escucha activa santiago carnegie',sim:'Escuchar con atención aparece en la Biblia y en libros de comunicación sin referencia religiosa. Acá se comparan ambas miradas.',bloques:[
   ['Qué es','Escuchar bien es prestar atención de verdad antes de opinar. Las dos miradas valoran esa actitud, con motivos distintos.'],
   ['Mirada cristiana','Santiago 1:19 dice que hay que ser pronto para oír y tardo para hablar. El amor al prójimo se muestra en prestarle atención.'],
   ['Mirada sin referencia religiosa','Dale Carnegie, en «Cómo ganar amigos e influir sobre las personas» (1936), recomendó interesarse de verdad por el otro y preguntarle por lo que le importa. Es un libro de divulgación, no un estudio científico.'],
   ['Qué coinciden','Escuchar primero hace sentir valorada a la otra persona y evita malentendidos.'],
   ['Dónde difieren','La mirada cristiana lo une al amor al prójimo; la otra lo presenta sobre todo como una habilidad práctica para caer bien o influir. Para una importa el motivo; para la otra, el resultado.'],
   ['Pasos',['En cada charla de esta semana, dejá hablar a la otra persona antes de opinar.','Preguntá por lo que dijo, no solo por cómo le fue.','Anotá cómo se sintió la conversación.']],
   ['Límites y cuándo consultar','Son consejos de práctica. Si una conversación te desborda, podés pedir un momento para pensar.'],
   ['Fuentes',[]]
  ]},
  {g:'Práctica diaria',t:'Hacer preguntas abiertas',ev:'General',kw:'preguntas abiertas charla conversación',q:'Las preguntas que empiezan con cómo, qué o por qué invitan a contar más que un sí o un no.',a:'En lugar de «¿te gustó?», preguntá «¿qué fue lo que más te gustó?».',r:'Charlas más largas y con más contenido.',l:'No hace falta que cada pregunta sea profunda.',s:null},
  {g:'Presencia',t:'Contacto visual y voz',ev:'General',q:'Mirar a la otra persona de forma natural y hablar con un volumen y ritmo cómodos transmiten atención.',a:'Practicá en una charla corta: mirá a la otra persona mientras escucha y hablá a un ritmo tranquilo.',r:'Charlas más fluidas.',l:'No hace falta mantener la mirada todo el tiempo. Si te incomoda, mirá cerca de los ojos o de la frente.',s:null},
  {g:'Presencia',t:'Ser uno mismo sin fingir',ev:'General',q:'Imitar a otra persona suele notarse. La gente valora más la coherencia que una personalidad ajena.',a:'Elegí un rasgo tuyo (humor, calma, curiosidad) y usalo en tus charlas de esta semana.',r:'Más autenticidad y confianza.',l:'Ser auténtico no quiere decir ignorar las normas del lugar donde estás.',s:null},
  {g:'Ser uno mismo',t:'Cómo ser uno mismo, paso a paso',ev:'Consejo general',kw:'ser uno mismo autenticidad identidad valores personalidad',sim:'Ser uno mismo no es hacer lo que uno quiera sin pensar en los demás, sino conocer tus rasgos y mostrarlos con respeto.',bloques:[
   ['Qué es','Ser uno mismo es actuar de forma coherente con tus valores y tu personalidad, sin copiar a otros para caer bien. También implica respetar a los demás y los acuerdos del lugar donde estás: escuela, iglesia o familia.'],
   ['Por qué cuesta','Muchas veces uno imita a otros por miedo al rechazo. Esa presión es normal, sobre todo en la adolescencia, y se aprende a manejarla con práctica.'],
   ['Pasos',['Anotá lo que te gusta, lo que te cuesta y lo que te importa. Esa lista es tu punto de partida.','Elegí uno o dos valores que quieras vivir, por ejemplo honestidad o lealtad, y pensá en una acción concreta para cada uno.','Compartí una opinión o un gusto propio en una charla de confianza y mirá cómo reacciona la otra persona.','Elegí personas con las que te sientas cómodo siendo vos. No hace falta agradarle a todo el mundo.','Revisá cada semana: ¿hice algo que me represente? ¿Me sentí presionado a actuar distinto?']],
   ['Errores que conviene evitar',['Cambiar tu forma de ser según con quién estés, hasta no reconocerte.','Usar «ser uno mismo» como excusa para faltar al respeto o lastimar a alguien.','Esperar aprobación constante antes de decir algo.']],
   ['Resultados razonables','Más tranquilidad al hablar, menos esfuerzo para sostener una imagen y relaciones más sinceras. Algunas personas no van a conectar con vos, y eso también es normal.'],
   ['Límites y cuándo consultar','Si sentís presión constante para cambiar quién sos, o burlas que te afectan mucho, hablalo con un adulto de confianza o con un profesional.'],
   ['Fuentes',[]]
  ]},
  {g:'Responder comentarios',t:'Frases para responder comentarios',ev:'Consejo general',kw:'frases responder comentarios bromas prejuicio',sim:'Frases cortas y claras para responder bromas o comentarios sobre tu vida personal, con calma.',bloques:[
   ['Qué es','Tener frases preparadas te ayuda a responder sin enojarte ni quedarte callado. Podés usarlas tal cual o adaptarlas a tu forma de hablar.'],
   ['Frases para usar',['«Sí, soy heterosexual. ¿Por qué lo preguntás?»','«Eso no tiene nada que ver con cómo me llevo con vos.»','«No me interesa hablar de eso. Cambiemos de tema.»','«Me parece que estás sacando conclusiones sin conocerme.»','«Si tenés una duda, preguntámela directamente, sin bromas.»','«Eso no me hace gracia. Por favor, dejalo.»','«Podemos seguir con lo que estábamos hablando.»','«Me molesta ese comentario. Si sigue, lo hablo con alguien.»']],
   ['Pasos',['Respirá antes de responder y hablá con calma, sin gritar.','Mirá a la persona y decí la frase una vez.','Si insisten, repetí la misma frase sin agregar explicaciones.','Si la situación se pone hostil o te sentís inseguro, alejate y contale a un adulto de confianza.']],
   ['Errores que conviene evitar',['Explicar tu vida personal para convencer a alguien que no quiere escuchar.','Responder con insultos: cambia el foco y puede meterte en problemas.','Quedarte con la molestia sin decir nada.']],
   ['Resultados razonables','Menos tensión en la conversación y más claridad sobre lo que aceptás. No podés controlar a todos, pero sí cómo respondés.'],
   ['Límites y cuándo consultar','Si las burlas son constantes, te afectan mucho o hay agresiones, hablalo con un adulto de confianza o con el orientador de la escuela.'],
   ['Fuentes',[]]
  ]},
  {g:'Responder comentarios',t:'Si te dicen que sos gay y no lo sos',ev:'Consejo general',kw:'bromas gay homosexual heterosexual responder aclarar',sim:'Frases para corregir una broma o suposición sobre tu orientación, sin insultar a nadie.',bloques:[
   ['Qué es','Cuando alguien asume algo sobre tu vida personal que no es cierto, podés corregirlo de forma clara. No hace falta decir nada negativo sobre otras personas para aclarar lo tuyo.'],
   ['Frases para usar',['«No soy gay, soy heterosexual. La broma no me hace gracia.»','«Eso no es cierto. Soy heterosexual.»','«Me equivocaste: soy heterosexual, así que dejá de decirlo.»','«Cada uno es como es, y yo soy heterosexual.»','«No necesito que me creas, pero te lo digo claro: soy heterosexual.»','«Si seguís, eso deja de ser un chiste para mí.»']],
   ['Pasos',['Respondé una vez, con calma y mirando a la persona.','Decí tu aclaración en una frase, sin justificarte de más.','Si siguen con la broma, repetí la misma frase sin subir el tono.','Si la situación se pone hostil, alejate y contale a un adulto de confianza.']],
   ['Errores que conviene evitar',['Insultar o burlarte de otras personas para defenderte.','Dar explicaciones largas: cuanto más te justificás, más se alarga la broma.','Responder con violencia física o amenazas.']],
   ['Resultados razonables','La mayoría de las bromas se apagan cuando no reciben reacción. No podés controlar lo que piensa cada persona, pero sí cómo respondés.'],
   ['Límites y cuándo consultar','Si las burlas son constantes, hay acoso o amenazas, hablalo con un adulto de confianza o con el orientador de la escuela. El acoso se puede denunciar y no tenés que aguantarlo solo.'],
   ['Fuentes',[]]
  ]},
  {g:'Presentarte',t:'Cómo presentarte a alguien nuevo',ev:'Consejo general',kw:'presentarse presentación conocer gente nueva',sim:'Decir tu nombre con claridad, una frase sobre vos y una pregunta para la otra persona.',bloques:[
   ['Qué es','Presentarte bien hace que la otra persona se sienta cómoda y abre la charla. No hace falta contar tu vida: alcanza con lo esencial.'],
   ['Pasos',['Saludá con una sonrisa y decí tu nombre con claridad.','Agregá una frase sobre vos, como de dónde sos o qué te gusta hacer.','Hacé una pregunta simple para que la otra persona hable: «¿Y vos?».','Repetí su nombre una vez en la charla para recordarlo.']],
   ['Errores que conviene evitar',['Hablar solo de vos, sin preguntar.','Dar una presentación demasiado larga.','Olvidar el nombre y fingir que lo sabés.']],
   ['Resultados razonables','Un comienzo más fácil y charlas que siguen sin esfuerzo forzado.'],
   ['Límites y cuándo consultar','Si te cuesta mucho conocer gente o sentís ansiedad constante al hablar con otros, consultá con un profesional de salud.'],
   ['Fuentes',[]]
  ]},
  {g:'Mensajes',t:'Conversar por mensaje sin malentendidos',ev:'Consejo general',kw:'mensajes chat texto whatsapp malentendidos tono',sim:'En un mensaje no se ven los gestos: conviene ser claro, breve y amable.',bloques:[
   ['Qué es','Por escrito, el tono depende de cómo lo lea la otra persona. Un mensaje corto y claro evita malentendidos y muestra respeto.'],
   ['Pasos',['Leé el mensaje antes de enviarlo y preguntate cómo lo puede leer la otra persona.','Usá frases completas y evitá los mensajes en mayúsculas, que se leen como enojo.','Si el tema es importante o delicado, mejor hablarlo en persona o por llamada.','Si no entendés un mensaje, preguntá antes de responder.']],
   ['Errores que conviene evitar',['Responder con ironía a alguien que no te conoce bien.','Enviar varios mensajes seguidos sin esperar la respuesta.','Leer mal un mensaje y reaccionar en caliente.']],
   ['Resultados razonables','Menos discusiones por escrito y conversaciones más claras.'],
   ['Límites y cuándo consultar','Si recibís mensajes hirientes o amenazas, guardá la captura y avisá a un adulto de confianza.'],
   ['Fuentes',[]]
  ]},
  {g:'Situaciones para practicar',t:'Una conversación que pierde ritmo',ev:'Práctica',kw:'conversación silencio pausa ritmo charla',sim:'Cuando la charla se apaga, hay varias formas de retomarla. Ninguna es la única correcta.',bloques:[
   ['Situación','Estás hablando con alguien y las respuestas se vuelven cortas. Hay silencios incómodos y no sabés si la otra persona quiere seguir.'],
   ['Posibles interpretaciones',['Está cansado o distraído, y no tiene que ver con vos.','Quizá el tema no le interesa.','Puede que esté pensando en otra cosa o que no sepa qué decir.']],
   ['Estilos de respuesta',['Directo: «Siento que la charla se apagó. ¿Preferís que lo dejemos para otro momento?».','Cálido: cambiar a algo que sabés que le gusta, con una pregunta abierta.','Humorístico: comentar el silencio con una frase liviana, sin burlarte de nadie.','Diplomático: cerrar con un «Gusto charlar contigo, hablamos después» si la otra persona no quiere seguir.']],
   ['Consecuencias probables',['Si preguntás directamente, puede aliviar la tensión o cortar la charla, según el contexto.','Si cambiás de tema con una pregunta abierta, suele reactivar la conversación.','Si insistís sin leer la señal, puede sentirse presionada.']],
   ['Ejercicio','Practicá esta situación con alguien de confianza. Después, anotá qué estilo usaste, cómo reaccionó la otra persona y qué harías distinto.'],
   ['Fuentes',[]]
  ]},
  {g:'Situaciones para practicar',t:'Un grupo donde hablan todos menos vos',ev:'Práctica',kw:'grupo participar hablar interrumpir voz',sim:'Participar sin imponerte es una habilidad. Hay formas de entrar en la conversación sin forzarla.',bloques:[
   ['Situación','En una reunión o un grupo, las personas hablan entre ellas y casi no te preguntan. Querés aportar, pero no encontrás el momento.'],
   ['Posibles interpretaciones',['Están entusiasmados y no se dieron cuenta de que no participaste.','Tal vez piensan que no tenés interés en el tema.','Puede que hablen más rápido o que el grupo sea nuevo para vos.']],
   ['Estilos de respuesta',['Directo: «Tengo una idea sobre esto, ¿me dejan contarla?».','Cálido: retomar algo que dijo alguien con una pregunta: «¿Y eso cómo lo ven ustedes?».','Humorístico: una frase breve para entrar: «Parece que me perdí algo, ¿me lo cuentan?».','Diplomático: esperar una pausa y sumar: «Coincido con lo que se dijo y agregaría que…».']],
   ['Consecuencias probables',['Hablar con claridad suele darte espacio sin interrumpir a nadie.','Preguntar por lo que dijo otro muestra interés y crea continuidad.','Si intentás entrar en medio de una discusión fuerte, puede sentirse como una interrupción.']],
   ['Ejercicio','En la próxima reunión o charla grupal, sumá una idea o una pregunta en el primer momento de pausa. Anotá cómo se sintió la conversación.'],
   ['Fuentes',[]]
  ]},
  {g:'Situaciones para practicar',t:'Una crítica que puede ser justa o injusta',ev:'Práctica',sim:'Recibir una crítica es difícil. Antes de responder, conviene separar qué parte es útil y qué parte no.',bloques:[
   ['Situación','Alguien te dice que tu trabajo o tu forma de actuar estuvo mal. Algo de lo que dice puede ser cierto, y otra parte quizá no.'],
   ['Posibles interpretaciones',['Te está ayudando, aunque lo diga de forma torpe.','Tiene información que vos no tenés.','Está molesto por algo ajeno a vos y lo descarga contigo.']],
   ['Estilos de respuesta',['Directo: «Entiendo lo que decís sobre la entrega. No entiendo por qué dice que fue falta de compromiso».','Cálido: «Gracias por decírmelo. Quiero entender bien qué pasó».','Humorístico: solo si la crítica no es seria y la otra persona lo permite: «No soy perfecto, pero algo voy a mejorar».','Diplomático: «Tomo lo que sirve y pienso sobre el resto. Lo charlamos después con calma».']],
   ['Consecuencias probables',['Si respondés con calma y preguntás, la conversación suele aclararse.','Si te defendés sin escuchar, puede parecer que no aceptás nada.','Si aceptás todo sin pensar, podés cargar con un problema que no es tuyo.']],
   ['Ejercicio','Pensá en una crítica que recibiste. Anotá qué parte era útil, qué parte no y cómo podrías responder hoy con calma.'],
   ['Fuentes',[]]
  ]},
  {g:'Situaciones para practicar',t:'Una exposición oral en la que estoy nervioso',ev:'Práctica',sim:'Los nervios son normales. El objetivo no es eliminarlos, sino hablar aunque estén.',bloques:[
   ['Situación','Tenés que exponer frente al curso o a un grupo. Sentís las manos frías, la voz temblorosa y pensás que todos lo notan.'],
   ['Posibles interpretaciones',['Los demás notan menos los nervios de lo que vos creés.','El público quiere que el tema se entienda, no que hables perfecto.','Quizá la exposición es nueva para vos, y eso explica la tensión.']],
   ['Estilos de respuesta',['Directo: «Estoy un poco nervioso, pero quiero contarles esto».','Cálido: empezar con una pregunta al público para bajar la presión.','Humorístico: una frase liviana sobre los nervios, sin exagerar.','Diplomático: pedir una pausa breve para tomar agua y ordenar ideas.']],
   ['Consecuencias probables',['Reconocer los nervios suele generar empatía, no burla.','Preparar tres ideas principales reduce el miedo a quedarse en blanco.','Intentar ocultar todo puede hacer que la exposición se sienta más rígida.']],
   ['Ejercicio','Ensayá la exposición de dos minutos frente a alguien de confianza. Después anotá qué fue lo más difícil y qué tenés que preparar para la próxima vez.'],
   ['Fuentes',[]]
  ]},
  {g:'Situaciones para practicar',t:'Alguien que interrumpe constantemente',ev:'Práctica',sim:'Cuando alguien no te deja terminar, hay formas de recuperar el turno sin pelearte.',bloques:[
   ['Situación','En una conversación de grupo, una persona te corta cada vez que empezás a hablar.'],
   ['Posibles interpretaciones',['Está entusiasmada y quiere aportar algo.','Quizá no se dio cuenta de que te interrumpe.','Puede que intente imponer su punto de vista.']],
   ['Estilos de respuesta',['Directo: «Un momento, quiero terminar esta idea».','Cálido: «Sé que tenés algo para decir. Termino y te doy la palabra».','Humorístico: «Me está costando hablar hoy, ¿me dejan terminar la frase?».','Diplomático: proponer al grupo que hablen por turnos.']],
   ['Consecuencias probables',['Si la frase es firme y amable, suele respetarse.','Si te quedás en silencio, la otra persona puede seguir tomando el espacio.','Si respondés con enojo, el foco pasa del tema al conflicto.']],
   ['Ejercicio','En una charla con dos o tres personas, practicá recuperar el turno con una frase breve. Anotá cómo reaccionaron.'],
   ['Fuentes',[]]
  ]}]},
 lider:{t:'Liderazgo',i:'Liderar es servir y responsabilizarse, no mandar. Practicalo en la escuela y la iglesia.',nota:'Consejos de práctica. Solo cito estudios que verifiqué; el resto es consejo general.',items:[
  {g:'Base del liderazgo',t:'Liderazgo de servicio',ev:'Revisión',q:'Una revisión de 285 artículos (1998–2018) mostró que el campo crece pero tiene definiciones y medidas poco claras, y propuso más investigación.',a:'Antes de dar indicaciones, preguntale a tu equipo qué necesita y ofrecé una ayuda concreta.',r:'Más confianza del grupo; sin garantías.',l:'Es una revisión de la literatura: no prueba que funcione siempre.',s:F_SERV},
  {g:'Base del liderazgo',t:'Dar el ejemplo',ev:'General',q:'Las personas miran más lo que hacés que lo que decís. Cumplir lo que prometés genera confianza.',a:'Elegí una cosa que pedís a otros (puntualidad, orden, respeto) y hacela primero durante una semana.',r:'Más credibilidad en el grupo.',l:'Nadie es perfecto: si te equivocás, reconocelo.',s:null},
  {g:'Decisiones y equipo',t:'Tomar decisiones',ev:'General',q:'Poner opciones por escrito ayuda a pensar con calma.',a:'Anotá 2 opciones, pros y contras, y elegí con un plazo.',r:'Decisiones más claras.',l:'Ninguna lista reemplaza el consejo de un adulto.',s:null},
  {g:'Decisiones y equipo',t:'Organizar un proyecto',ev:'General',q:'Un proyecto necesita objetivo, tareas con responsables y fechas.',a:'Organizá una actividad chica (ensayo, trabajo grupal) con esos 3 pasos.',r:'Menos desorden y mejor reparto.',l:'Ajustá a tu equipo real.',s:null},
  {g:'Decisiones y equipo',t:'Delegar tareas',ev:'General',q:'Delegar no es pasar lo que no querés hacer: es confiar en que otro puede resolverlo con apoyo.',a:'Para cada tarea, decí qué se espera, cuándo se entrega y a quién consultar si surge un problema.',r:'Menos sobrecarga para vos y más autonomía para el equipo.',l:'Delegá según la capacidad de cada persona, no solo por comodidad.',s:null},
  {g:'Conflictos y desacuerdos',t:'Resolver conflictos',ev:'General',q:'Escuchar primero y hablar de lo que pasó, sin atacar a la persona, baja la tensión.',a:'Frase modelo: «Yo vi esto, me sentí así, ¿cómo lo ves vos?».',r:'Menos discusiones.',l:'Si hay maltrato, pedí ayuda a un adulto.',s:null},
  {g:'Conflictos y desacuerdos',t:'Cuando alguien no está de acuerdo',ev:'General',q:'Un desacuerdo no es una falta de respeto. Escuchar la postura completa antes de responder baja la tensión y muestra que su opinión importa.',a:'Pasos: 1) dejá que termine sin interrumpir; 2) repetí lo que entendiste («entendés que…»); 3) preguntá qué le preocupa; 4) decí tu postura con un motivo concreto; 5) buscá un criterio común (un objetivo, una regla o un plazo).',r:'Discusiones más cortas y decisiones que el grupo sostiene.',l:'A veces no hay acuerdo posible. Podés decidir igual, pero explicá por qué, sin humillar a nadie.',s:null},
  {g:'Conflictos y desacuerdos',t:'Cuando la decisión no es la que querías',ev:'General',q:'Aceptar una decisión colectiva, aunque no sea la tuya, mantiene la confianza del grupo.',a:'Decí: «No era lo que yo proponía, pero lo apoyo. Si vemos que no funciona, lo revisamos».',r:'Equipos que se sienten escuchados aunque no siempre ganen.',l:'Si la decisión implica algo peligroso o injusto, no la apoyes: hablalo con un adulto de confianza.',s:null},
  {g:'Feedback y críticas',t:'Aceptar críticas y errores',ev:'General',q:'Reconocer un error sin excusas suele generar respeto.',a:'Ante una crítica, respondé: «Gracias, lo voy a pensar». Después decidí qué es útil.',r:'Más confianza con el tiempo.',l:'No toda crítica es justa.',s:null},
  {g:'Feedback y críticas',t:'Dar feedback sin herir',ev:'General',q:'Un comentario útil habla de una acción concreta, no de la persona.',a:'Usá la fórmula: «Lo que hiciste fue…; el efecto fue…; lo que propongo es…».',r:'Que la otra persona pueda cambiar sin ponerse a la defensiva.',l:'Si hay maltrato o una situación grave, pedí ayuda a un adulto.',s:null},
  {g:'Mirada cristiana y no cristiana',t:'Servir o dominar: dos formas de liderar',ev:'Comparación',kw:'liderazgo servir dominar servidor humildad fe',sim:'Comparamos la mirada cristiana y una mirada sin referencia religiosa sobre liderar sirviendo.',bloques:[
   ['Qué es','Muchas tradiciones coinciden en que liderar puede ser servir a otros o imponerse sobre ellos. Acá se comparan dos miradas para que cada persona decida con su propio criterio.'],
   ['Mirada cristiana','En el Evangelio, Jesús dijo que el que quiera ser grande entre sus seguidores debe ser servidor de los demás (Marcos 10:43-45), y lavó los pies de sus discípulos como ejemplo (Juan 13:14-15). Filipenses 2:3-4 invita a considerar a los demás por encima de uno mismo. Para esta mirada, el liderazgo se mide por el bien que hace a las personas.'],
   ['Mirada sin referencia religiosa','Robert Greenleaf, en un ensayo de 1970, propuso el «liderazgo de servicio»: el líder primero busca servir y que las personas a su cargo crezcan, y después dirige. La idea se usa en gestión y educación, sin necesidad de creer en nada religioso.'],
   ['Qué coinciden','Ambas miradas dicen que el poder debe estar al servicio de otros, que la humildad y la escucha generan confianza, y que el líder responde por lo que hace.'],
   ['Dónde difieren','La mirada cristiana pone el servicio dentro de la relación con Dios y con el prójimo, con el amor como motivo central. La otra lo justifica sobre todo por sus resultados, como equipos más sanos o más motivados.'],
   ['Pasos',['Preguntate: ¿esta decisión ayuda a las personas que están a mi cargo?','Revisá si le pedís a otros algo que vos no hacés.','Elegí esta semana una acción de servicio concreta: en casa, en la escuela o en la comunidad.']],
   ['Límites y cuándo consultar','Son marcos para reflexionar, no reglas. Para temas de fe, hablá con tu pastor o líder de comunidad; para convivencia o decisiones difíciles, con un adulto de confianza.'],
   ['Fuentes',[]]
  ]},
  {g:'Mirada cristiana y no cristiana',t:'Cuando alguien no está de acuerdo: dos miradas',ev:'Comparación',kw:'desacuerdo conflicto perdón reconciliar hablar en privado',sim:'La mirada cristiana busca reconciliarse y hablar con amor; la otra, resolver con acuerdos y criterios claros. Pueden convivir.',bloques:[
   ['Qué es','Cuando alguien no está de acuerdo con vos o con una decisión, las dos miradas coinciden en tratarlo con respeto y en buscar una salida.'],
   ['Mirada cristiana','Mateo 18:15 propone hablar primero en privado con la persona. Romanos 12:18 pide vivir en paz con todos, en cuanto dependa de uno. Efesios 4:15 invita a decir la verdad con amor, y Proverbios 15:1 señala que una respuesta amable calma el enojo.'],
   ['Mirada sin referencia religiosa','El libro «Getting to Yes» (Fisher y Ury, 1981, del Harvard Negotiation Project) propone separar a las personas del problema, enfocarse en los intereses y no solo en las posiciones, y buscar opciones que sirvan a ambas partes con criterios objetivos.'],
   ['Qué coinciden','Escuchar antes de responder, hablar en privado cuando se puede y buscar lo que tienen en común.'],
   ['Dónde difieren','La mirada cristiana pone énfasis en la reconciliación y el perdón; la otra, en un acuerdo práctico. Perdonar no siempre significa estar de acuerdo, y un acuerdo no siempre implica reconciliación.'],
   ['Pasos',['Escuchá la postura completa sin interrumpir.','Separá a la persona del problema: hablen del hecho, no de la persona.','Preguntá qué le importa a cada uno detrás de su postura.','Buscá una opción que sirva a los dos.','Si no se resuelve, pedí ayuda a un tercero de confianza.']],
   ['Límites y cuándo consultar','Si hay maltrato, amenazas o abuso, no es un desacuerdo común: buscá ayuda de un adulto de confianza de inmediato.'],
   ['Fuentes',[]]
  ]},
  {g:'Práctica diaria',t:'Reconocer el trabajo de otros',ev:'General',q:'Un agradecimiento concreto motiva más que un elogio general.',a:'Esta semana, agradecé a alguien por algo puntual: «Gracias por preparar la parte de…».',r:'Equipos más motivados.',l:'El reconocimiento tiene que ser sincero, no para quedar bien.',s:null},
  {g:'Práctica diaria',t:'Pedir ayuda sin perder autoridad',ev:'General',q:'Un buen líder sabe cuándo no sabe algo. Pedir ayuda muestra madurez, no debilidad.',a:'Decí: «No sé cómo resolver esto. ¿Me ayudás a pensarlo?».',r:'Más confianza en el equipo.',l:'Pedir ayuda no reemplaza la responsabilidad de decidir.',s:null},
  {g:'Temas a tratar',t:'Objetivos del grupo',ev:'Consejo general',sim:'Definir qué quiere lograr el grupo y por qué, antes de repartir tareas.',bloques:[
   ['Qué es','Un objetivo claro dice qué van a lograr juntos, para qué y para cuándo. Sin objetivo, cada uno hace lo que cree que corresponde.'],
   ['Para qué sirve','Alinea al grupo, evita discusiones por cosas distintas y permite saber si van bien.'],
   ['Preguntas para abrir el tema',['¿Qué queremos lograr, en concreto?','¿Para cuándo?','¿Qué pasa si lo logramos? ¿Y si no lo logramos?','¿Qué parte de esto le importa a cada uno?']],
   ['Pasos',['Juntá al grupo en un momento tranquilo.','Pedí que cada uno diga qué espera del proyecto.','Escribí un objetivo en una frase, con una fecha.','Revisalo con todos y ajustá lo que no se entienda.']],
   ['Errores que conviene evitar',['Repartir tareas sin saber hacia dónde van.','Objetivos tan vagos que nadie sabe si los cumplió, como «que nos vaya bien».','Imponer un objetivo sin preguntar al grupo.']],
   ['Límites y cuándo consultar','Si el objetivo cambia, no pasa nada: se puede revisar. Lo importante es que el cambio lo conozcan todos.'],
   ['Fuentes',[]]
  ]},
  {g:'Temas a tratar',t:'Reparto de tareas y responsabilidades',ev:'Consejo general',sim:'Decidir quién hace qué, con qué plazo y a quién consultar si surge un problema.',bloques:[
   ['Qué es','Repartir tareas es asignar a cada persona una parte concreta, con fecha y una forma de avisar cuando termina.'],
   ['Para qué sirve','Evita que unos hagan todo y otros nada, y deja claro quién responde por cada cosa.'],
   ['Preguntas para abrir el tema',['¿Quién puede hacer esta tarea y quién quiere hacerla?','¿Qué tan difícil es?','¿Cuándo tiene que estar lista?','¿A quién le avisa si tiene un problema?']],
   ['Pasos',['Listá todas las tareas del proyecto.','Preguntá quién puede hacer cada una y respetá las preferencias cuando sea posible.','Anotá responsable y fecha en un lugar que todos puedan ver.','Hacé un control breve cada semana.']],
   ['Errores que conviene evitar',['Repartir por simpatía, sin mirar la capacidad de cada uno.','Dar tareas sin explicar lo que se espera.','Quitarle una tarea a alguien sin hablarlo antes.']],
   ['Límites y cuándo consultar','Si alguien no puede cumplir, conviene ajustar el reparto antes que cargar a la persona con culpas.'],
   ['Fuentes',[]]
  ]},
  {g:'Temas a tratar',t:'Cómo nos comunicamos',ev:'Consejo general',sim:'Acordar cómo, cuándo y por dónde se habla dentro del grupo.',bloques:[
   ['Qué es','Es acordar los canales (mensajes, reuniones, una cartelera), los horarios para responder y el tono de las conversaciones.'],
   ['Para qué sirve','Reduce malentendidos y evita que la información llegue solo a algunos.'],
   ['Preguntas para abrir el tema',['¿Por qué medio nos avisamos?','¿Qué respuesta esperamos y en cuánto tiempo?','¿Cómo hablamos cuando hay un problema?']],
   ['Pasos',['Acordá un canal principal para lo importante.','Definí un horario razonable para responder.','Resumí lo acordado por escrito y compartilo con todos.','Revisá cada tanto si el canal sigue funcionando.']],
   ['Errores que conviene evitar',['Tomar decisiones en privado y contarlas después.','Hablar mal de alguien en el chat del grupo.','Responder con ironías o mensajes apurados.']],
   ['Límites y cuándo consultar','Los mensajes privados sirven, pero las decisiones del grupo conviene dejarlas registradas en un lugar común.'],
   ['Fuentes',[]]
  ]},
  {g:'Temas a tratar',t:'Qué hacer si alguien falta o no cumple',ev:'Consejo general',sim:'Cómo tratar la falta de un integrante sin humillarlo y sin ignorar el problema.',bloques:[
   ['Qué es','Cuando alguien falta o no cumple, conviene hablar con la persona antes de juzgar. Puede haber un motivo que no conocés.'],
   ['Para qué sirve','Mantiene la confianza y ayuda a encontrar una solución justa para el grupo.'],
   ['Preguntas para abrir el tema',['¿Qué pasó? ¿Hay algo que te impida cumplir?','¿Qué necesitás para poder hacerlo?','¿Qué podemos ajustar para que funcione?']],
   ['Pasos',['Hablá con la persona en privado, nunca frente a los demás.','Preguntá antes de suponer, y escuchá la respuesta completa.','Acordá una nueva fecha o un cambio concreto, por escrito si hace falta.','Si se repite, contalo al responsable del grupo o a un adulto de confianza.']],
   ['Errores que conviene evitar',['Humillar a la persona frente a los demás.','Dejar pasar el problema hasta que explote.','Hacer el trabajo de otro sin decirlo, lo que genera resentimiento.']],
   ['Límites y cuándo consultar','Si la situación implica maltrato o discriminación, no la resuelvas solo: consultá con un adulto responsable.'],
   ['Fuentes',[]]
  ]},
  {g:'Temas a tratar',t:'Límites y respeto en el grupo',ev:'Consejo general',sim:'Acordar reglas de convivencia que protejan a todos.',bloques:[
   ['Qué es','Son las reglas básicas que el grupo acepta, como respetar los turnos, no burlarse y cuidar lo que se comparte.'],
   ['Para qué sirve','Da seguridad: cada persona sabe qué esperar y qué no se tolera.'],
   ['Preguntas para abrir el tema',['¿Qué nos hace sentir cómodos en el grupo?','¿Qué conductas no toleramos?','¿Qué hacemos cuando alguien no respeta una regla?']],
   ['Pasos',['Armá una lista corta de tres a cinco acuerdos.','Pedí que cada uno aporte una regla y debatan juntos.','Escribila y revisala de vez en cuando.','Aplicala igual para todos, incluido el líder.']],
   ['Errores que conviene evitar',['Crear reglas que solo se aplican a algunos.','Tener reglas sin consecuencias claras.','Callar frente a burlas o comentarios hirientes.']],
   ['Límites y cuándo consultar','Si hay acoso, amenazas o violencia, la regla es clara: se corta y se pide ayuda a un adulto de confianza.'],
   ['Fuentes',[]]
  ]},
  {g:'Temas a tratar',t:'Revisar cómo va el grupo',ev:'Consejo general',sim:'Hacer una revisión breve y periódica del avance y del clima del grupo.',bloques:[
   ['Qué es','Un espacio corto para ver qué salió bien, qué no y qué cambiar, con todos.'],
   ['Para qué sirve','Permite corregir a tiempo y reconocer el trabajo hecho.'],
   ['Preguntas para abrir el tema',['¿Qué salió bien esta semana?','¿Qué nos costó?','¿Qué cambiamos para la próxima?']],
   ['Pasos',['Reservá 10 a 15 minutos cada semana.','Empezá reconociendo algo bueno de cada persona.','Preguntá qué dificultades tuvieron, sin buscar culpables.','Acordá uno o dos cambios concretos y repasalos la semana siguiente.']],
   ['Errores que conviene evitar',['Esperar al final del proyecto para hablar del problema.','Revisar solo lo que está mal.','Hacer la revisión como un juicio y no como una charla.']],
   ['Límites y cuándo consultar','Si el grupo está cansado o tenso, a veces conviene bajar la carga antes de exigir más.'],
   ['Fuentes',[]]
  ]},
  {g:'Temas a tratar',t:'Cuándo llevar un tema a un adulto',ev:'Consejo general',sim:'Qué temas no conviene resolver solo como líder y a quién acudir.',bloques:[
   ['Qué es','Hay temas que el líder no debe resolver solo: acoso, maltrato, riesgos para la salud o la seguridad, o conflictos que superan al grupo.'],
   ['Para qué sirve','Protege a todos y evita que un líder cargue con algo que no le corresponde.'],
   ['Preguntas para abrir el tema',['¿Esto afecta la seguridad o el bienestar de alguien?','¿Lo puedo resolver con el grupo o necesito ayuda?','¿Quién es un adulto de confianza que puede acompañar?']],
   ['Pasos',['Escuchá a la persona afectada con atención.','No prometas guardar un secreto si hay riesgo: decí que vas a buscar ayuda.','Llevá el tema a un adulto responsable, como un docente, un pastor o un familiar.','Anotá lo que pasó, con fechas y hechos, no con suposiciones.']],
   ['Errores que conviene evitar',['Intentar resolver solo algo grave.','Minimizar lo que cuenta la persona.','Difundir el problema entre el grupo.']],
   ['Límites y cuándo consultar','Si alguien está en peligro, llamá de inmediato a emergencias (911 en Argentina).'],
   ['Fuentes',[]]
  ]},
  {g:'Temas a tratar',t:'Tomar decisiones difíciles',ev:'Consejo general',sim:'Cómo decidir cuando no hay una opción que deje contento a todos.',bloques:[
   ['Qué es','Hay decisiones que no van a gustar a todos. Un buen líder decide con criterio, explica el motivo y se responsabiliza por el resultado.'],
   ['Para qué sirve','Mantiene el avance del grupo y muestra que las decisiones se toman con criterio y no por presión.'],
   ['Preguntas para abrir el tema',['¿Qué criterio nos ayuda a decidir: el bien del grupo, la justicia o la seguridad?','¿Qué pasa si no decidimos?','¿Quién se ve afectado y cómo lo explicamos?']],
   ['Pasos',['Reuní la información necesaria y escuchá a quienes van a ser afectados.','Definí el criterio de decisión antes de elegir.','Decidí y comunicá la decisión con el motivo, sin rodeos.','Revisá el resultado después de un plazo acordado.']],
   ['Errores que conviene evitar',['Postergar la decisión hasta que la presión la tome por vos.','Decidir y después echarle la culpa a otro.','No explicar el motivo y dejar que cada uno invente el suyo.']],
   ['Límites y cuándo consultar','Si la decisión afecta la seguridad o los derechos de alguien, consultá con un adulto responsable antes de decidir.'],
   ['Fuentes',[]]
  ]},
  {g:'Situaciones para practicar',t:'Liderar cuando otros no están de acuerdo',ev:'Práctica',sim:'Liderar no significa que todos estén de acuerdo. Significa escuchar, decidir y explicar.',bloques:[
   ['Situación','Vas a proponer algo en tu grupo y la mitad no lo quiere. Hay que avanzar igual.'],
   ['Posibles interpretaciones',['No todos entienden todavía el objetivo.','Algunos temen que el cambio les dé más trabajo.','Quizá alguien tuvo una mala experiencia parecida antes.']],
   ['Estilos de respuesta',['Directo: «Escuché sus objeciones. Vamos con esta propuesta por estas razones».','Cálido: «Quiero que todos se sientan parte. ¿Qué les preocupa más?».','Humorístico: solo si el ambiente es distendido: «Nadie está obligado a amar la idea, pero necesitamos avanzar».','Diplomático: proponer una prueba corta antes de decidir del todo.']],
   ['Consecuencias probables',['Escuchar y explicar el motivo suele reducir el rechazo.','Decidir sin escuchar puede dejar resentimiento aunque la decisión sea buena.','Dejar de decidir por miedo al conflicto puede frenar al grupo.']],
   ['Ejercicio','Proponé una decisión chica en tu grupo. Si hay desacuerdo, explicá el motivo y acordá una revisión en una semana.'],
   ['Fuentes',[]]
  ]},
  {g:'Situaciones para practicar',t:'Pedir un cambio sin imponerlo',ev:'Práctica',sim:'Proponer un cambio sin imponerlo es una habilidad clave para liderar.',bloques:[
   ['Situación','Querés que el grupo cambie una forma de trabajar que no funciona, pero nadie propuso cambiarla.'],
   ['Posibles interpretaciones',['La forma actual le resulta cómoda a alguien.','Quizá nadie notó el problema.','Puede que el cambio le parezca una crítica personal.']],
   ['Estilos de respuesta',['Directo: «Creo que la forma en que repartimos tareas no está funcionando. ¿Lo revisamos?».','Cálido: «Gracias por lo que hicieron. Creo que podemos mejorar esto juntos».','Humorístico: «Propongo una prueba de una semana y, si no funciona, volvemos a lo de antes».','Diplomático: preguntar primero qué piensa cada uno, antes de presentar tu propuesta.']],
   ['Consecuencias probables',['Presentar el problema como algo del grupo, no de una persona, suele generar menos resistencia.','Imponer el cambio sin preguntar puede generar rechazo, aunque sea bueno.','Esperar sin hacer nada puede hacer que el problema se repita.']],
   ['Ejercicio','Escribí un problema concreto de tu grupo y preparate una propuesta de cambio con una prueba de una semana. Anotá la respuesta de los demás.'],
   ['Fuentes',[]]
  ]}]},
 desarrollo:{t:'Ciencia de los hábitos',i:'',items:[
  {g:'Hábitos',t:'Cuánto tarda un hábito',ev:'Limitada',q:'En un estudio con 96 voluntarios durante 12 semanas, repetir una conducta a diario la fue automatizando; según los resúmenes, la mediana fue de 66 días, con mucha variación entre personas. Faltar un día no afectó el proceso.',a:'Elegí 1 hábito pequeño y atalo a algo fijo («después de cepillarme»).',r:'Esperá meses, no días.',l:'Muestra pequeña y de adultos jóvenes.',s:F_HAB},
  {g:'Descanso',t:'Dormir 8 a 10 horas',ev:'Guía oficial',q:'Los CDC citan 8 a 10 horas para los 13 a 18 años.',a:'Mirá tu hora de dormir en Agenda → Traslados y descanso.',r:'Más energía.',l:'Datos de encuestas.',s:F_CDC},
  {g:'Constancia',t:'Qué hacer si fallás un día',ev:'General',q:'Faltar un día no arruina un hábito. Lo que más pesa es volver en la siguiente oportunidad, no compensar con culpa.',a:'Regla de los dos días: si faltás uno, retomá al día siguiente sin hacer el doble.',r:'Hábitos más estables a largo plazo.',l:'Si faltás muchos días seguidos, reducí la meta a algo más chico.',s:null},
  {g:'Metas',t:'Empezar chico',ev:'General',q:'Una meta pequeña y concreta es más fácil de sostener que una grande y vaga.',a:'Escribí una meta de 2 minutos (por ejemplo, leer una página) y ampliala cuando se vuelva automática.',r:'Más constancia.',l:'No hay una escala única: cada persona necesita una distinta.',s:null},
  {g:'Revisión',t:'Revisar cada semana',ev:'General',q:'Mirar lo que hiciste una vez por semana ayuda a ver qué funciona y qué no, sin juzgarte.',a:'Cada domingo, anotá 1 hábito que cumpliste y 1 que te costó. Ajustá la meta de la semana siguiente.',r:'Más claridad sobre tu progreso.',l:'No es un examen: si una semana fue difícil, empezá de nuevo sin culparte.',s:null},
  {g:'Propósito',t:'Escribir para qué lo hacés',ev:'General',q:'Un hábito es más fácil de sostener cuando sabés para qué lo hacés. El motivo puede ser personal, familiar, de fe o de salud.',a:'Escribí una frase con el motivo de tu hábito principal y ponela donde la veas.',r:'Más constancia en los días difíciles.',l:'El motivo es tuyo: no hace falta compararlo con el de otra persona.',s:null},
  {g:'Pausas',t:'Pausas que sostienen',ev:'General',q:'Descansar no es perder el tiempo: un cuerpo y una mente cansados sostienen peor cualquier hábito.',a:'Agendá una pausa corta cada día (5 minutos de caminar o estirarte) y un día libre por semana.',r:'Menos desgaste y más constancia.',l:'Si el cansancio dura semanas, consultá con un profesional de salud.',s:null},
  {g:'Entorno',t:'Diseñar el entorno',ev:'General',q:'Un hábito es más fácil si el entorno lo facilita, y más difícil si lo estorba.',a:'Dejá lista la ropa o los materiales la noche anterior, y sacá de la vista lo que te distrae.',r:'Menos decisiones en el momento.',l:'No todo se puede controlar: ajustá lo que sí depende de vos.',s:null},
  {g:'Salud hormonal',t:'Para qué sirve la testosterona',ev:'Consejo general',sim:'Es una hormona que ayuda a construir músculo, huesos fuertes y energía. Sus niveles cambian con el sueño, el peso, el estrés y el cuidado general.',bloques:[
   ['Qué es','La testosterona es una hormona que el cuerpo produce sobre todo en los testículos. Aumenta durante la pubertad y participa en el desarrollo de las características masculinas.'],
   ['Para qué sirve',['Masa y fuerza muscular: ayuda a construir y mantener el músculo.','Huesos: contribuye a mantener la densidad ósea.','Glóbulos rojos: participa en su producción.','Energía y ánimo: influye en cómo te sentís y en la motivación.','Deseo sexual y función sexual en adultos.','Distribución de la grasa corporal.']],
   ['Qué afecta sus niveles',['Sueño: dormir poco varios días seguidos baja la testosterona. Un estudio con hombres jóvenes (Leproult y Van Cauter, 2011) mostró caídas de 10 a 15 % tras una semana con 5 horas de sueño por noche.','Exceso de grasa corporal: se asocia con niveles más bajos.','Estrés crónico: mantiene elevado el cortisol, que compite con la producción de testosterona.','Alcohol en exceso y tabaco.','Alimentación muy escasa durante mucho tiempo.']],
   ['Cuándo consultar','Si tenés cansancio persistente, baja energía, pérdida de deseo o de fuerza, o cambios que te preocupan, consultá con un médico: pueden pedir análisis de sangre. Si tenés menos de 18 años y tu desarrollo va bastante más lento que el de tus compañeros, hablalo con un pediatra o un endocrinólogo.'],
   ['Fuentes',[]]
  ]},
  {g:'Salud hormonal',t:'Cómo cuidar la testosterona de forma natural',ev:'Consejo general',sim:'Dormir bien, moverte con fuerza, comer suficiente y cuidar el peso son las bases. Los atajos suelen costar caro.',bloques:[
   ['Qué es','No hay una forma de subir la testosterona de golpe. Lo que sí se puede hacer es cuidar los hábitos que la mantienen en un nivel sano.'],
   ['Pasos',['Dormí entre 8 y 10 horas, con horarios regulares (los CDC citan ese rango para adolescentes de 13 a 18 años).','Hacé fuerza dos o tres veces por semana, como las sesiones de tu programa. Los cambios se notan con meses de constancia; una sola sesión no cambia la hormona de forma duradera.','Comé suficiente proteína, verduras, cereales integrales y grasas saludables, sin dietas extremas.','Mantené un peso saludable; si tenés dudas, consultalo con tu médico.','Reducí el alcohol y no fumes.','Gestioná el estrés: caminar, tener tiempo libre y hablar con alguien de confianza.']],
   ['Lo que no conviene hacer',['Tomar suplementos «boosters» u hormonas sin indicación médica: muchos no tienen evidencia y algunos contienen sustancias no declaradas.','Usar esteroides anabólicos: tienen efectos graves y pueden frenar la producción natural de testosterona.','Comprar productos por recomendaciones de internet o de quien los vende.']],
   ['Mitos frecuentes',['«Comer solo carne sube la testosterona»: no hay evidencia de eso.','«Entrenar hasta el agotamiento la sube mucho»: el exceso de entrenamiento y la falta de descanso pueden bajarla.']],
   ['Límites y cuándo consultar','Si tenés síntomas que no pasan, consultá con un médico antes de probar cualquier producto.'],
   ['Fuentes',[]]
  ]},
  {g:'Empezar',t:'Frases para empezar',ev:'Consejo general',sim:'20 frases para arrancar cuando cuesta dar el primer paso.',bloques:[['Frases para leer hoy',['Empezar imperfecto es mejor que no empezar.','Hoy alcanza con un paso pequeño.','No hace falta tener todo claro para dar el primer paso.','Lo que hacés hoy le habla a tu yo de mañana.','Una hora de esfuerzo hoy vale más que la promesa de mañana.','El primer intento siempre es el más difícil.','No esperes el momento perfecto: creálo con lo que tenés.','Empezá por lo más chico que puedas sostener.','Cada inicio cuesta, y eso es señal de que te importa.','Hacelo aunque sea un poco: el poco también cuenta.','Tu primer día no define tu historia.','Dar el paso ya es ganar algo.','Lo que empieza con decisión se sostiene con práctica.','No te compares con quien empezó antes: empezá tu camino.','Mejor avanzar despacio que quedarse quieto.','Hoy es una buena oportunidad para empezar otra vez.','Una acción simple repetida cambia más que un gran plan que nunca arranca.','Ponete en marcha y después vas ajustando.','El camino se hace al caminarlo.','Hoy elegís el primer paso, y eso ya es decidir.']]]},
  {g:'Seguir cuando cuesta',t:'Frases para seguir cuando cuesta',ev:'Consejo general',sim:'20 frases para continuar en los días difíciles.',bloques:[['Frases para leer hoy',['Cuando cuesta, es señal de que estás creciendo.','Un día difícil no es un fracaso de todo el proceso.','Seguí, aunque sea con menos ganas.','Respirá, ajustá el ritmo y seguí.','Lo que sentís hoy no decide lo que vas a lograr.','Pedir ayuda también es avanzar.','Descansar no es rendirse.','Dar un paso chico cuando todo pesa también cuenta.','La constancia vence a la motivación cuando la motivación se va.','No todos los días van a ser buenos, y está bien.','Podés estar cansado y seguir siendo igual de capaz.','Cuando tengas ganas de abandonar, pensá por qué empezaste.','Cada vez que volvés, te fortalecés.','No hace falta hacerlo perfecto: hace falta seguir.','Los obstáculos son parte del camino, no el final.','Cuando la meta parezca lejos, mirá lo que ya avanzaste.','Lo difícil de hoy puede ser lo que más valorás mañana.','No dejes que un error te haga olvidar todo lo que lograste.','Tu esfuerzo se nota aunque nadie lo aplauda.','Seguí un poco más: a veces el avance está a un paso de distancia.']]]},
  {g:'Autoestima',t:'Frases para tu autoestima',ev:'Consejo general',sim:'20 frases para recordar tu valor, sin depender de la opinión de otros.',bloques:[['Frases para leer hoy',['Tu valor no depende de lo que opinen los demás.','Podés ser amable con vos mismo mientras mejorás.','Merecés respeto, también de tu propia voz interior.','No necesitás demostrar nada para ser valioso.','Está bien ser diferente a los demás.','Conocerte mejor es una de las mejores inversiones.','Tus opiniones importan, y podés expresarlas con respeto.','Dejá de compararte: cada persona tiene su tiempo.','Tus errores te enseñan, no te definen.','Sos más que tus peores días.','Tenés cualidades que vale la pena cultivar.','Podés sentirte orgulloso de lo que sos hoy.','Hablarte con respeto cambia cómo te sentís.','Tu historia la escribís vos, día a día.','No tenés que caerle bien a todos para ser una buena persona.','Tus límites también son parte de tu valor.','Reconocer tus logros, aunque sean chicos, te fortalece.','Podés aprender algo nuevo de cada persona.','Tu forma de ser tiene lugar en el mundo.','Ser auténtico es un regalo para vos y para los demás.']]]},
  {g:'Constancia',t:'Frases sobre constancia',ev:'Consejo general',sim:'20 frases para sostener un hábito día a día.',bloques:[['Frases para leer hoy',['La constancia silenciosa construye lo que el apuro no logra.','Lo pequeño repetido se vuelve grande.','Un día más de esfuerzo es un día menos de duda.','No busques resultados rápidos: buscá progreso sostenido.','Lo que hacés todos los días define quién sos.','La disciplina es libertad a largo plazo.','Mejor cincuenta días seguidos que un mes de intensidad y después nada.','Cuando dudes, volvé a la rutina.','Un hábito se consolida con repetición, no con perfección.','Anotar tu progreso te muestra lo que ya lograste.','El esfuerzo de hoy es la base del mañana.','Si fallaste, retomá al día siguiente.','No hace falta correr: alcanza con no detenerte.','Cada repetición cuenta, aunque nadie la vea.','La paciencia también es una forma de fuerza.','Lo importante no es la velocidad, sino la dirección.','Hacer algo un poco cada día suma más que hacerlo todo de golpe.','La constancia convierte las metas en costumbres.','Sé fiel a tu proceso aunque cambien las circunstancias.','Seguir es la forma más segura de llegar.']]]},
  {g:'Decisiones',t:'Frases para decidir',ev:'Consejo general',sim:'20 frases para elegir con calma y actuar con firmeza.',bloques:[['Frases para leer hoy',['Decidir es elegir qué querés priorizar.','Elegí según tus valores, no según el miedo.','Pensar bien una decisión no significa tardar para siempre.','Podés cambiar de opinión cuando aprendés algo nuevo.','Cada decisión te enseña algo, incluso cuando sale mal.','Pedí consejo, pero la decisión es tuya.','Un no a tiempo protege tu energía.','Decidí con calma y actuá con firmeza.','Lo que elegís hoy abre o cierra caminos.','Preguntate: ¿esto me acerca a lo que quiero?','Anotar pros y contras aclara la mente.','No todas las decisiones tienen que ser perfectas.','Tomá una decisión, aunque sea pequeña, y mirá los resultados.','Elegir también es aceptar que algo queda afuera.','Podés empezar de nuevo cuando lo necesitás.','Tu tiempo es limitado: usalo en lo que te importa.','Actuá antes de que el miedo decida por vos.','Cada elección responsable te da más confianza.','Las decisiones correctas se notan con el tiempo.','Confiá en tu criterio y seguí aprendiendo.']]]},
  {g:'Relaciones',t:'Frases sobre vínculos',ev:'Consejo general',sim:'20 frases para cuidar amistades y vínculos con respeto.',bloques:[['Frases para leer hoy',['Rodeate de personas que te sumen.','Escuchar también es una forma de querer.','Tratar bien a los demás te hace mejor persona.','Una disculpa sincera puede reparar mucho.','El respeto es la base de cualquier amistad.','Podés ser amable sin dejar de poner límites.','Cada persona merece una oportunidad de conocerte bien.','Dar sin esperar algo a cambio fortalece el vínculo.','Los buenos amigos celebran tus logros.','Hablá con respeto incluso cuando no estés de acuerdo.','La paciencia en una relación se nota.','Perdonar no significa olvidar, pero libera.','Elegí compañía que te haga sentir en paz.','Un gesto pequeño de cariño puede cambiar un día.','Escuchar con atención dice «me importás».','No hace falta ser perfecto para ser un buen amigo.','Cuidá tus vínculos como cuidás tus metas.','La gratitud fortalece cualquier relación.','Sé el tipo de persona con la que te gustaría estar.','Pedir ayuda a tiempo también es cuidar a los que querés.']]]},
  {g:'Descanso',t:'Frases sobre descanso',ev:'Consejo general',sim:'20 frases para recordar que descansar también es parte del proceso.',bloques:[['Frases para leer hoy',['Descansar también es parte del entrenamiento.','Tu cuerpo necesita pausas para crecer.','Dormir bien es una forma de cuidarte.','Parar un rato no te quita valor.','La calma también es productiva.','Escuchá tu cansancio antes de que te pida ayuda.','Un descanso a tiempo evita un agotamiento mayor.','Respirar despacio ordena la mente.','Tu mente también necesita silencio.','No tenés que estar ocupado todo el tiempo para valer.','Recuperarte es avanzar.','Cuidar tu energía es elegir mejor.','Caminar un rato puede aclarar muchas ideas.','Cerrar el día con gratitud ayuda a descansar.','Un día libre bien usado recarga las fuerzas.','Apagar pantallas antes de dormir ayuda al descanso.','Escuchar música tranquila puede bajar la tensión.','El descanso no es un premio: es una necesidad.','Sentirte bien hoy también es un objetivo.','Cuidar el cuerpo y la mente es parte de cuidarte.']]]},
  {g:'Gratitud',t:'Frases de gratitud',ev:'Consejo general',sim:'20 frases para mirar lo bueno de cada día.',bloques:[['Frases para leer hoy',['Agradecer cambia la forma en que mirás el día.','Hay cosas buenas que pasan todos los días, aunque sean chicas.','Agradecé por lo que tenés, no solo por lo que querés.','Decir gracias fortalece tus vínculos.','Mirá lo que ya construiste y sentite orgulloso.','Anotar tres cosas buenas al día ayuda a ver lo positivo.','Agradecer también a quienes te enseñaron algo.','La gratitud calma la ansiedad.','Cada día tiene algo para aprender.','Valorá a las personas que te acompañan.','Lo simple también puede ser un regalo.','Agradecer no quita tus ganas de crecer.','Pensá en un problema resuelto y celebralo.','Una comida, un techo o una conversación pueden ser motivo de gratitud.','Cuando agradecés, tu mente busca lo que suma.','Celebrá tus avances, aunque sean pequeños.','Reconocer lo bueno no niega lo difícil.','Hoy podés elegir ver lo que sí funciona.','Lo que valorás crece.','Agradecer es una forma de empezar bien el día.']]]},
  {g:'Paciencia',t:'Frases sobre paciencia',ev:'Consejo general',sim:'20 frases para avanzar sin apuro y confiar en el proceso.',bloques:[['Frases para leer hoy',['Todo lo importante lleva tiempo.','Los cambios reales se notan después de semanas o meses.','No te apures: cada cosa tiene su ritmo.','Ser paciente también es una forma de avanzar.','Tu proceso es tuyo; no lo compares con el de otros.','Esperar no es lo mismo que quedarse quieto.','Las cosas buenas valen la espera.','Confiá en el proceso aunque no veas resultados todavía.','La calma te ayuda a pensar mejor.','Las semillas tardan en crecer, pero crecen.','Un paso a la vez es suficiente.','Mejor lento y seguro que rápido y roto.','Aceptar tu tiempo te quita presión.','Lo que tarda suele durar más.','Podés avanzar aunque el camino sea largo.','No todo se resuelve hoy, y está bien.','La paciencia convierte la espera en preparación.','Cada día sumás aunque no lo sientas.','Respirá, soltá la urgencia y seguí.','El progreso lento también es progreso.']]]},
  {g:'Emociones',t:'Manejar el enojo',ev:'Consejo general',kw:'enojo ira emociones calma respirar control',sim:'El enojo es una emoción normal. Lo importante es cómo se expresa y qué hacés con él.',bloques:[
   ['Qué es','El enojo aparece cuando sentimos que algo es injusto o nos lastima. Es normal, pero las respuestas impulsivas suelen traer más problemas que el motivo original.'],
   ['Pasos',['Notá las señales del cuerpo: calor, tensión o respiración rápida.','Hacé una pausa y respirá lento antes de responder.','Ponele nombre a lo que sentís: «estoy enojado porque…».','Decí lo que pasa con calma, sin insultar ni humillar.','Cuando te calmes, revisá qué podés cambiar y qué tenés que aceptar.']],

   ['Mirada cristiana','Efesios 4:26 dice que podemos enojarnos sin pecar y que no hay que dejar que el enojo dure hasta el fin del día. Santiago 1:19 invita a ser pronto para oír, tardío para hablar y tardío para airarse.'],
   ['Límites y cuándo consultar','Si el enojo te lleva a romper cosas, lastimar a alguien o te cuesta controlarlo seguido, hablalo con un adulto de confianza, con tu pastor o con un profesional.'],
   ['Fuentes',[]]

let cSec='belleza', cQ='';
function chipCls(ev){ return /Guía|Revisión|Oficial/.test(ev)?'c-r':ev==='Limitada'?'c-v':'c-d'; }
function racha7(key){ let n=0; for(let d=0;d<7;d++){ const x=new Date(); x.setDate(x.getDate()-d); if(S.prac[key+'|'+iso(x)]) n++; } return n; }
function pasosHechos(key){ return (S.guias||{})[key]||[]; }
function bloqueHTML(key,titulo,c){
  if(/^Pasos/.test(titulo) && Array.isArray(c)){
    const hecho=pasosHechos(key);
    return `<h4>${esc(titulo)}</h4><div class="pasos">${c.map((p,n)=>`<button class="check" data-gp="paso" data-k="${esc(key)}" data-n="${n}" aria-pressed="${hecho.includes(n)}"><span class="ico">${hecho.includes(n)?'✅':'⬜'}</span><span>${esc(p)}</span></button>`).join('')}</div><p class="muted">${hecho.filter(x=>x<c.length).length} de ${c.length} pasos marcados</p>`;
  }
  if(titulo==='Fuentes'){ return Array.isArray(c)&&c.length ? `<h4>Fuentes para profundizar</h4><ul>${c.map(([l,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a></li>`).join('')}</ul>` : ''; }
  if(Array.isArray(c)) return `<h4>${esc(titulo)}</h4><ul>${c.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  return `<h4>${esc(titulo)}</h4><p>${esc(c)}</p>`;
}
function itemHTML(k,it,i){
  const key=k+i, hoy=iso(new Date());
  if(it.bloques){
    const tieneFuentes=it.bloques.some(([t,c])=>t==='Fuentes'&&c.length);
    const tienePasos=it.bloques.some(([t])=>/^Pasos/.test(t));
    return `<details class="card"><summary>${esc(it.t)} <span class="chip ${chipCls(it.ev)}" style="margin-left:8px">${esc(it.ev)}</span></summary>
    <p class="sim"><b>En resumen:</b> ${esc(it.sim)}</p>
    <details class="det"><summary>Ver explicación completa</summary>
      ${it.bloques.map(([t,c])=>bloqueHTML(key,t,c)).join('')}
      ${tieneFuentes?'':'<p class="muted">Consejo general: no cito un estudio específico.</p>'}
      ${(k==='desarrollo'||k==='valores')?segHTML(key,true):''}
      ${tienePasos?`<button class="btn" data-gp="reset" data-k="${esc(key)}" style="margin-top:8px">Reiniciar pasos</button>`:''}
    </details></details>`;
  }
  const hecho=!!S.prac[key+'|'+hoy];
  return `<details class="card"><summary>${esc(it.t)} <span class="chip ${chipCls(it.ev)}" style="margin-left:8px">${esc(it.ev)}</span></summary>
    <p class="sim"><b>En resumen:</b> ${esc(it.q)}</p>
    <div class="det"><p><b>Ejercicio:</b> ${esc(it.a)}</p>${COMO[it.t]?'<h4>Cómo hacerlo, paso a paso</h4><ol>'+COMO[it.t].map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':''}<p><b>Resultado razonable:</b> ${esc(it.r)}</p><p><b>Límites:</b> ${esc(it.l)}</p>
    <p class="muted">${it.s?`Fuente: <a href="${esc(it.s[1])}" target="_blank" rel="noopener">${esc(it.s[0])}</a>`:'Consejo general: no cito un estudio específico.'}</p></div>
    <button class="btn ${hecho?'ok':''}" data-gp="prac" data-k="${esc(key)}">${hecho?'✔ Practicado hoy':'Lo practiqué hoy'}</button> <span class="muted">${racha7(key)}/7 días</span>${k==='desarrollo'?segHTML(key,false):''}</details>`;
}

 {g:'Valores',t:'Qué son los valores y cómo vivirlos',ev:'Consejo general',sim:'Los valores son lo que consideramos importante. Desde la fe se afirman en la Palabra de Dios y se viven en lo cotidiano.',bloques:[
  ['Qué es','Los valores son lo que consideramos importante y guía nuestras decisiones, como la honestidad, el respeto o la lealtad. Desde la fe cristiana se apoyan en la Palabra de Dios y en el ejemplo de Jesús.'],
  ['Mirada cristiana','Filipenses 4:8 invita a pensar en lo verdadero, lo honesto, lo justo y lo amable. Mateo 22:37-39 resume la vida en amar a Dios y al prójimo, y Colosenses 3:12-14 habla de compasión, bondad, humildad, paciencia y amor.'],
  ['Pasos',['Escribí de tres a cinco valores que quieras vivir, como honestidad, respeto o servicio.','Buscá en la Biblia pasajes que los respalden y leelos despacio.','Elegí una acción concreta por semana que muestre ese valor.','Pedile a alguien de confianza que te diga si lo ves reflejado en tu vida.','Orá pidiendo ayuda para vivirlos, sobre todo cuando te cueste.']],

 {g:'Personalidad y temperamento',t:'Personalidad y temperamento: lo que Dios te dio',ev:'Consejo general',sim:'La forma natural de ser se recibe; lo que se trabaja es cómo se usa.',bloques:[
  ['Qué es','La personalidad es el conjunto de rasgos con los que te relacionás y pensás. El temperamento es la predisposición natural: cuánta energía tenés, qué tan intensas son tus emociones y cómo reaccionás ante la presión. Se forman en gran parte desde la infancia y no se eligen.'],
  ['Mirada cristiana','Salmo 139:13-14 dice que fuimos formados con cuidado. 1 Corintios 12:4-7 habla de distintos dones con el mismo Espíritu, lo que muestra que la diversidad de personas tiene un propósito. Lo que se trabaja no es el temperamento en sí, sino cómo se expresa.'],
  ['Pasos',['Observá tu forma natural: qué te da energía, qué te agota y cómo reaccionás cuando te presionan.','Aceptá lo bueno de tu forma de ser: cada temperamento tiene fortalezas.','Identificá una reacción que te hace daño o hace daño a otros, como hablar sin pensar, y practicá una pausa antes de responder.','Pedí feedback a personas de confianza sobre cómo te ven.','Orá pidiendo sabiduría para usar tus rasgos para el bien de otros.']],
  ['Errores que conviene evitar',['Compararte con personas de otro temperamento y sentir que valés menos.','Justificar cualquier conducta con «así soy».','Querer cambiar tu temperamento de golpe, en lugar de madurar paso a paso.']],

 {g:'Carácter',t:'Carácter: cómo se forma con el tiempo',ev:'Consejo general',sim:'El carácter se forma en lo cotidiano, sobre todo en las dificultades.',bloques:[
  ['Qué es','El carácter es la suma de tus decisiones y hábitos, especialmente en lo que hacés cuando nadie mira. Se forma con el tiempo y se nota en la forma de tratar a los demás.'],
  ['Mirada cristiana','Romanos 5:3-5 explica que la dificultad produce perseverancia, carácter y esperanza. Gálatas 5:22-23 describe el fruto del Espíritu: amor, gozo, paz, paciencia, bondad, fidelidad, mansedumbre y dominio propio. Proverbios 25:28 dice que quien no tiene dominio sobre su espíritu es como una ciudad sin muro.'],
  ['Pasos',['Practicá la virtud en lo chico: puntualidad, cumplir lo prometido, decir la verdad.','Cuando fallés, reconocelo sin excusas y pedí perdón.','Sostené hábitos que forman carácter: oración, lectura bíblica y servicio a otros.','Elegí una virtud por mes, por ejemplo paciencia o dominio propio, y revisala cada semana.','Pedí a Dios fuerza para perseverar cuando aparezca el cansancio.']],

 {g:'Principios',t:'Principios: lo que no se negocia',ev:'Consejo general',sim:'Los principios son decisiones firmes que guían lo que hacés, aunque cueste.',bloques:[

/* Vista Frases (Etapa 3): A citas verificables, B pasajes bíblicos, C reflexiones originales */
function vistaFrases(){
  const sel=[];
  ['carisma','desarrollo'].forEach(k=>CONT[k].items.forEach((it,i)=>{ if(/^Frases|^Si te dicen/.test(it.t)) sel.push([k,it,i]); }));
  const A=`<div class="card"><h3>A. Citas verificables</h3>
  <p class="muted">Frases cuya autoría se puede comprobar en una fuente.</p>
  <h4>«It is not the critic who counts»</h4>
  <p><b>Autor:</b> Theodore Roosevelt.<br><b>Obra:</b> «Citizenship in a Republic», discurso en la Sorbonne, París, 23 de abril de 1910.<br><b>Fuente:</b> Project Gutenberg, libro n.º 13930 (<i>African and European Addresses</i>, 1910).</p>
  <p><b>Contexto:</b> Roosevelt sostiene que el valor de una persona no está en quien critica desde afuera, sino en quien participa y se expone, aunque a veces se equivoque. La versión en español («No es el crítico quien cuenta») es una traducción propia, no literal.</p></div
  <h4>«Everything can be taken from a man but one thing»</h4>
  <p><b>Autor:</b> Viktor Frankl.<br><b>Obra:</b> <i>Man's Search for Meaning</i> (primera edición en alemán, 1946).<br><b>Fuente de la cita:</b> el texto aparece en las citas registradas de la obra (WikiQuote, sección de la obra).</p>
  <p><b>Contexto:</b> Frankl describe que, aun en la pérdida total de libertad externa, queda la elección de la actitud frente a las circunstancias. En español: «Se puede quitar todo a una persona, menos una cosa: la última de las libertades humanas, elegir su actitud ante cualquier circunstancia». Traducción propia, no literal.</p>
  <h4>«He who has a why to live for can bear almost any how»</h4>
  <p><b>Autor original:</b> Friedrich Nietzsche. Frankl lo cita en <i>Man's Search for Meaning</i>.<br><b>Procedencia:</b> citado por Frankl en la obra (edición en inglés), con la mención de Nietzsche.<br><b>Contexto:</b> quien tiene un sentido por el que vivir puede soportar casi cualquier dificultad. Traducción propia, no literal.</p></div>`;
  const B=`<div class="card"><h3>B. Pasajes bíblicos</h3>
  <p class="muted">Se indican la referencia y una idea general. Leé el texto completo en tu Biblia (por ejemplo, Reina-Valera 1960). La idea es una interpretación, no el texto bíblico.</p>
  <ul>
  <li><b>Mateo 22:37-39</b>: amar a Dios y al prójimo como base de la vida.</li>
  <li><b>Filipenses 4:8</b>: pensar en lo verdadero, lo justo y lo amable.</li>

      const k=clave(id,SEM), r=S.log[k];
      if(r && r.rpe===5 && r.eb===3 && r.ea===3 && r.tec===4 && (r.reps||0)===0 && !r.molestia && !r.nota){
        delete r.rpe; delete r.eb; delete r.ea; delete r.tec; delete r.reps;
      }
    }
    S.migr.sem_2026_10_19_fix=true;
  }
  guardar();
})();

/* ============ ARRANQUE ============ */
render();
fetch('/api/health').then(r=>r.json()).then(d=>{
  iaEstado = d.iaConfigurada ? 'IA conectada: Claude ('+d.modelo+').' : 'La IA todavía no está configurada en el servidor.';
}).catch(()=>{
  iaEstado = 'No pude consultar el servidor.';
}).finally(()=>{ if(!run && vista==='ia') render(); });
</script>
