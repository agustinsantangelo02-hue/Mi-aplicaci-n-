<!DOCTYPE html>
<html lang="es-AR" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Híbrido · Mi entrenamiento</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><text y='9' font-size='9'>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{--bg:#F4F1EA;--card:#FFFFFF;--ink:#16181C;--mute:#5B606B;--line:#DAD5C9;--acc:#E8491D;--f:#E8491D;--r:#0E9F8E;--v:#D99A00;--m:#6F5BD6;--d:#7A7F89;--ok:#1D8A4B;--warn:#B3261E;--nav:#FFFFFF;--shadow:0 1px 2px rgba(0,0,0,.06);--a:#E0457B}
:root[data-theme="dark"]{--bg:#121417;--card:#1C2026;--ink:#F2EFE8;--mute:#A3A8B3;--line:#2F353E;--acc:#FF6B3D;--f:#FF6B3D;--r:#3BD1BE;--v:#F5BE3A;--m:#A794FF;--d:#9AA0AB;--ok:#4FD17F;--warn:#FF8A80;--nav:#1C2026;--shadow:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121417;--card:#1C2026;--ink:#F2EFE8;--mute:#A3A8B3;--line:#2F353E;--acc:#FF6B3D;--f:#FF6B3D;--r:#3BD1BE;--v:#F5BE3A;--m:#A794FF;--d:#9AA0AB;--ok:#4FD17F;--warn:#FF8A80;--nav:#1C2026;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;line-height:1.05;margin:0 0 .4em;letter-spacing:.2px}
h1{font-size:2.6rem}h2{font-size:1.7rem}h3{font-size:1.25rem}
button,a,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.muted{color:var(--mute);font-size:.95rem}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.85rem;font-weight:600;color:#fff;background:var(--d)}
.c-f{background:var(--f)}.c-r{background:var(--r)}.c-v{background:var(--v);color:#1a1a1a}.c-m{background:var(--m)}.c-d{background:var(--d)}.c-a{background:var(--a)}
.bigbtn{display:block;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:.5px;cursor:pointer;padding:12px;text-align:center;text-decoration:none}
.bigbtn:active{transform:scale(.99)}
.btn{min-height:46px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.btn.pri{border-color:var(--acc);background:var(--acc);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:10px}
.bars>div{flex:1;text-align:center;font-size:.85rem;color:var(--mute)}
.bars b{display:block;background:var(--acc);border-radius:8px 8px 4px 4px;min-height:4px;margin-bottom:4px}
.note{border-left:4px solid var(--v);padding:8px 12px;background:color-mix(in srgb,var(--v) 12%,transparent);border-radius:8px;font-size:.95rem}
.danger{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
ul{padding-left:20px;margin:6px 0}li{margin:4px 0}
/* ===== Nav ===== */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:flex;justify-content:flex-start;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:0 0 auto;min-width:84px;background:none;border:0;padding:6px 2px;min-height:56px;cursor:pointer;color:var(--mute);font-size:.8rem;font-weight:600;border-radius:12px}
nav button[aria-current="page"]{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
nav svg{width:24px;height:24px;display:block;margin:0 auto 2px;stroke:currentColor;fill:none;stroke-width:2}
.hero{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:3.4rem;line-height:.95;margin:6px 0 2px}
.hero span{color:var(--acc)}
.ex-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.progress-label{font-weight:600;color:var(--mute)}
.check{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:2px solid var(--line);margin:8px 0;cursor:pointer;min-height:52px}
.check input{width:24px;height:24px;accent-color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-weight:600}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px;min-height:46px;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.day-card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border-left:6px solid var(--d);padding-left:14px}
.day-card.today{outline:2px solid var(--acc)}
.day-name{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.3rem}
pre,textarea.export{font-size:.8rem;max-height:160px;overflow:auto}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;font-weight:600}
@media (min-width:900px){nav{left:50%;right:auto;transform:translateX(-50%);width:720px;border-radius:18px 18px 0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
nav{display:none!important}
#top{position:fixed;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--nav);border-bottom:1px solid var(--line)}
#mb{min-width:48px;min-height:48px;font-size:1.6rem;border:2px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer}
#tt{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.5rem}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:13}
#dr{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--card);z-index:14;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 8px 16px}
.dbtn{display:block;width:100%;text-align:left;min-height:52px;border:0;background:none;border-radius:12px;padding:10px 14px;font-weight:600;font-size:1.05rem;cursor:pointer}
.dbtn[aria-current="page"]{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.wrap{padding-top:calc(76px + env(safe-area-inset-top,0px))!important}
/* ===== Guías, pasos marcables y economía (usa las mismas variables de color) ===== */
input[type=search]{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px;min-height:46px;width:100%}
button.check{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;margin:6px 0;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px}
button.check:disabled{cursor:default}
button.check .ico{flex:0 0 auto}
.grupo{margin-top:20px;font-size:1.45rem}
.det{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.det h4{margin:14px 0 4px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:1.15rem}
.sim{margin:6px 0}
</style>
</head>
<body>
<header id="top"><button id="mb" aria-label="Abrir menú" aria-expanded="false">☰</button><span id="tt">Híbrido</span></header>
<div id="ov" class="hidden"></div><aside id="dr" class="hidden" aria-label="Menú"></aside>
<main class="wrap" id="app" aria-live="polite"></main>

<nav aria-label="Navegación principal" id="nav"></nav>
<div id="toast" class="toast hidden" role="status"></div>

<script>
/* ============ DATOS ============
   Ejercicios: cada uno con su ficha completa. t = tipo (f fuerza, r resistencia, v velocidad/agilidad, m movilidad). */
const TIPOS = {f:{n:'Fuerza',c:'c-f'},r:{n:'Resistencia',c:'c-r'},v:{n:'Agilidad',c:'c-v'},m:{n:'Movilidad',c:'c-m'},d:{n:'Descanso',c:'c-d'},a:{n:'Abdomen',c:'c-a'}};
const EX = {
 sent:{n:'Sentadillas',t:'f',g:'Piernas y glúteos',p:'Fuerza base para correr, saltar y subir escaleras.',s:'De pie, pies a la altura de los hombros, puntas levemente afuera, tronco erguido.',e:['Llevá la cadera hacia atrás y hacia abajo, como si te sentaras en una silla.','Las rodillas siguen la dirección de los dedos y no se cierran hacia adentro.','Bajá hasta donde tu movilidad te deje, con la espalda derecha.','Empujá el piso con todo el pie, sobre todo el talón, para subir.'],r:'Inhalá al bajar, exhalá al subir.',x:['Talones que se levantan.','Rodillas que se meten hacia adentro.','Espalda que se redondea al final.'],c:'Podés hacer 10 repeticiones sin que cambie la forma ni se despegue el talón.',d:'4 × 15–20',fa:'Sentadilla agarrándote de una silla, bajando menos.',ha:'Sentadilla con mochila liviana al pecho, bajando en 3 segundos.',w:'Si sentís dolor agudo en la rodilla, parate.'},
 flex:{n:'Flexiones tradicionales',t:'f',g:'Pecho, hombros, tríceps y core',p:'Empuje del tren superior sin equipamiento.',s:'Manos un poco más anchas que los hombros, cuerpo recto de cabeza a talones.',e:['Mantené abdomen y glúteos apretados, como una tabla.','Bajá el pecho en bloque, con los codos a unos 45° del cuerpo.','Subí empujando el piso hasta estirar los brazos.'],r:'Exhalá al subir, inhalá al bajar.',x:['La cadera se cae hacia el piso.','Los codos abiertos en cruz.','Medio movimiento sin bajar el pecho.'],c:'El cuerpo forma una línea recta y el pecho casi toca el piso.',d:'4 × 8–15 (sin llegar al fallo)',fa:'Flexiones inclinadas (ver abajo).',ha:'Pausa de 2 segundos abajo, sin dejar caer la cadera.',w:'No entrenes hasta el fallo. Dejá 1–2 repeticiones en reserva.'},
 flexinc:{n:'Flexiones inclinadas',t:'f',g:'Pecho y tríceps (versión fácil)',p:'Progresión para llegar a las flexiones tradicionales.',s:'Manos sobre una mesa o baranda firme, cuerpo en línea recta.',e:['Mantené el cuerpo recto desde la cabeza hasta los talones.','Bajá el pecho hacia el borde de apoyo.','Subí empujando hasta estirar los brazos.'],r:'Exhalá al subir.',x:['Cadera que se hunde.','Apoyo en algo que se mueve.'],c:'Línea recta y control en la bajada.',d:'3 × 10–15',fa:'Apoyo más alto.',ha:'Apoyo más bajo, hasta llegar al piso.',w:'Usá solo superficies firmes y estables.'},
 remo:{n:'Remo con mochila',t:'f',g:'Espalda, bíceps y postura',p:'Fortalece la espalda para compensar horas sentado.',s:'Inclinado desde la cadera, espalda neutra, mochila colgando de las asas.',e:['Mantené la espalda recta, con la mirada al piso unos centímetros adelante.','Llevá la mochila hacia la cintura, juntando los omóplatos.','Bajala despacio, sin dejar que la espalda se redondee.'],r:'Exhalá al tirar, inhalá al bajar.',x:['Tirar con los brazos en vez de con la espalda.','Balancear el tronco.'],c:'Sentís la espalda trabajar entre los omóplatos.',d:'4 × 12–15',fa:'Mochila más liviana o apoyo de una mano en una mesa firme.',ha:'Pausa de 1 segundo arriba, con mochila algo más pesada.',w:'Mochila liviana (libros de poco peso) y estable. Nada de estructuras improvisadas.'},
 zanc:{n:'Zancadas hacia atrás',t:'f',g:'Piernas, glúteos y equilibrio',p:'Trabaja cada pierna por separado.',s:'De pie, pies juntos, tronco erguido.',e:['Dá un paso atrás y apoyá la punta del pie.','Bajá hasta que la rodilla de atrás casi toque el piso.','El peso queda en el pie de adelante. Subí y volvé al centro.'],r:'Inhalá al bajar, exhalá al subir.',x:['La rodilla de adelante pasa mucho la punta del pie.','Inclinar el tronco hacia adelante.'],c:'Equilibrio estable y el tronco erguido.',d:'3 × 10 por pierna',fa:'Zancada apoyándote en una pared.',ha:'Zancada con mochila liviana al pecho.',w:'Si perdés el equilibrio, apoyate en algo firme.'},
 puente:{n:'Puente de glúteos',t:'f',g:'Glúteos e isquios',p:'Fortalece la cadera, clave para correr y para la postura.',s:'Acostado boca arriba, rodillas flexionadas, pies apoyados.',e:['Empujá con los talones y subí la cadera hasta alinear hombros, cadera y rodillas.','Apretá los glúteos arriba un segundo.','Bajá despacio.'],r:'Exhalá al subir.',x:['Arquear la espalda baja.','Empujar con la punta del pie.'],c:'Sentís los glúteos trabajar, no la zona lumbar.',d:'4 × 15–20',fa:'Puente con los pies más cerca de la cadera.',ha:'Puente a una pierna, con la cadera nivelada.',w:'Si sentís molestia lumbar, reducí la altura.'},
 bisagra:{n:'Bisagra de cadera',t:'f',g:'Isquiotibiales y glúteos',p:'Patrón de bisagra para levantar cosas sin dañar la espalda.',s:'De pie, rodillas casi rectas (no bloqueadas), mochila liviana en las manos.',e:['Llevá la cadera hacia atrás, como cerrando una puerta con el trasero.','Bajá la mochila por delante de las piernas, con la espalda neutra.','Sentí estirar la parte de atrás del muslo y volvé a subir apretando glúteos.'],r:'Inhalá al bajar, exhalá al subir.',x:['Doblar la espalda en vez de la cadera.','Bajar tanto que la espalda cede.'],c:'La espalda se mantiene plana y el estiramiento está en el muslo.',d:'3 × 12',fa:'Hacelo sin mochila.',ha:'Bisagra con mochila un poco más pesada, sin perder la espalda neutra.',w:'Espalda neutra siempre. Si duele la lumbar, detenete.'},
 elev:{n:'Elevaciones de talones',t:'f',g:'Pantorrillas',p:'Fuerza para tobillos y correr con más estabilidad.',s:'De pie, pies juntos, cerca de una pared si hace falta.',e:['Subí sobre las puntas de los pies.','Pausa arriba un segundo.','Bajá lento.'],r:'Respirá normal.',x:['Rebotar en vez de subir controlado.'],c:'Subís y bajás despacio, sin perder el equilibrio.',d:'2 × 15',fa:'Apoyo en una pared.',ha:'Una pierna por vez.',w:'Hacelo sobre piso firme.'},
 bird:{n:'Bird-dog',t:'f',g:'Core y estabilidad lumbar',p:'Control del tronco y coordinación.',s:'En cuadrupedia: manos bajo los hombros, rodillas bajo la cadera.',e:['Estirá el brazo derecho adelante y la pierna izquierda atrás.','Mantené la cadera nivelada, sin girar.','Volvé despacio y cambiá de lado.'],r:'Exhalá al estirar.',x:['Girar la cadera.','Subir demasiado la pierna.'],c:'El tronco no se mueve y la espalda sigue plana.',d:'3 × 10 por lado',fa:'Solo brazo o solo pierna.',ha:'Bird-dog con pausa de 3 segundos.',w:'Si sentís la lumbar cargada, bajá la altura.'},
 plancha:{n:'Plancha abdominal',t:'f',g:'Core completo',p:'Estabilidad del tronco.',s:'Antebrazos en el piso, codos bajo los hombros.',e:['Cuerpo recto de cabeza a talones.','Apretá abdomen y glúteos.','Respirá sin dejar de sostener.'],r:'Respiración corta y constante.',x:['Cadera caída o levantada.'],c:'Línea recta durante todo el tiempo.',d:'3 × 30–40 s',fa:'Apoyo de rodillas.',ha:'Plancha con elevación alterna de brazo, sin girar la cadera.',w:'Parate si se cae la espalda.'},
 caminar:{n:'Caminata rápida',t:'r',g:'Resistencia aeróbica',p:'Base cardiovascular suave.',s:'Postura erguida, brazos relajados.',e:['Caminá a un ritmo en el que puedas hablar pero no cantar.','Pasos cortos y frecuentes.'],r:'Respiración por la nariz si podés.',x:['Ir tan rápido que no podés hablar.'],c:'Podés hablar en frases cortas.',d:'10–20 min',fa:'Ritmo más lento.',ha:'Más minutos, nunca más rápido de lo cómodo.',w:'Hidratate antes y después.'},
 trote:{n:'Trote suave',t:'r',g:'Resistencia',p:'Mejora la capacidad de correr sin cansarte rápido.',s:'Postura erguida, mirada al frente.',e:['Empezá con un trote muy suave.','Pisá debajo del cuerpo, no adelante.','Mantené el ritmo en el que podés hablar.'],r:'Respiración rítmica.',x:['Ir demasiado rápido al principio.'],c:'Podés hablar y sentís que podrías seguir.',d:'1–2 min',fa:'Caminar.',ha:'Trotar un poco más.',w:'Si sentís dolor en la rodilla o el tobillo, pasá a caminar.'},
 int:{n:'Carrera por intervalos',t:'r',g:'Resistencia por intervalos',p:'Subir la resistencia de a poco.',s:'Ritmo suave, zapatillas cómodas.',e:['Trotá 2 minutos (o 1 si todavía no tolerás).','Caminá 1–2 minutos para recuperarte.','Repetí 5–6 ciclos según el cansancio.'],r:'Respiración controlada.',x:['Trotar más rápido de lo planeado.'],c:'Terminás los ciclos sin sentirte mareado.',d:'5–6 ciclos',fa:'1 min trote + 2 min caminata.',ha:'Sumar 1 ciclo cuando estés cómodo.',w:'Detenete si sentís mareo, dolor agudo o dificultad para respirar.'},
 acel:{n:'Aceleraciones progresivas',t:'v',g:'Velocidad técnica',p:'Enseña a acelerar con buena técnica.',s:'Parado, un pie adelante, inclinación leve.',e:['Arrancá suave y subí la velocidad en 8–10 segundos.','Llegá al 70 % de tu velocidad, nunca al máximo.','Frená gradualmente y caminá para volver.'],r:'Respirá durante toda la aceleración.',x:['Ir a máxima velocidad.'],c:'Mantenés la postura y los pasos cortos.',d:'3 × 8–10 s',fa:'Saltar y caminar hacia atrás.',ha:'No recomendado para ahora. Si estás recuperado, máximo 2 más.',w:'Son opcionales. Sin sprints máximos.'},
 tecnica:{n:'Técnica básica de carrera',t:'v',g:'Técnica de carrera',p:'Correr con menos esfuerzo y menos riesgo de lesión.',s:'De pie, cuerpo alto, hombros relajados.',e:['Inclinate apenas desde los tobillos.','Brazos en 90°, moviéndose hacia adelante y atrás.','Pisá debajo del cuerpo y con pasos cortos.'],r:'Respiración rítmica.',x:['Frenar al apoyar el pie.'],c:'Pasos ligeros y sin ruido al pisar.',d:'2 × 20 s',fa:'Marcha rápida con estos puntos.',ha:'Trote suave con foco en la técnica.',w:'Evitá hacerla cuando estés muy cansado.'},
 lat:{n:'Desplazamientos laterales',t:'v',g:'Agilidad lateral',p:'Pasos laterales controlados para cambiar de dirección.',s:'Posición de media sentadilla, pies a la altura de los hombros.',e:['Dá un paso lateral con una pierna.','Juntá la otra pierna sin cruzarla.','Mantené la cadera baja durante 10 segundos.'],r:'Respiración constante.',x:['Pararse muy alto.'],c:'Te movés sin perder el equilibrio.',d:'4 × 10 s',fa:'Pasos más lentos.',ha:'Más velocidad, sin perder control.',w:'Hacelo en un lugar sin obstáculos.'},
 cambio:{n:'Cambios de dirección controlados',t:'v',g:'Agilidad',p:'Cambiar de dirección con control.',s:'Caminando, rodillas levemente flexionadas.',e:['Trotá suave y frená apoyando bien los pies.','Cambiá de dirección apoyándote en el pie de afuera.','Volvé a trotar en la nueva dirección.'],r:'Respiración constante.',x:['Girar con las piernas rígidas.'],c:'Podés frenar sin tambalear.',d:'4 × 10 m',fa:'Caminar y girar.',ha:'Más velocidad, sin llegar al máximo.',w:'Espacio libre, sin obstáculos.'},
 equil:{n:'Equilibrio sobre una pierna',t:'v',g:'Estabilidad y propiocepción',p:'Mejora el control de tobillos y rodillas.',s:'De pie, pies juntos, manos en la cintura.',e:['Levantá un pie unos centímetros del piso.','Mantené la vista en un punto fijo.','Sostené la posición sin mover el tronco.'],r:'Respiración lenta.',x:['Mirar al piso.'],c:'Sostenés 30 segundos sin apoyar el otro pie.',d:'2 × 20–30 s',fa:'Apoyar la mano en una pared.',ha:'Cerrar los ojos unos segundos.',w:'Hacelo cerca de algo firme por si perdés el equilibrio.'},
 coord:{n:'Coordinación de pies',t:'v',g:'Coordinación',p:'Mejora el ritmo y la agilidad de los pies.',s:'De pie, rodillas levemente flexionadas.',e:['Marcá un ritmo suave con los pies.','Cambiá de pie en cada paso.','Sumá brazos cuando te sientas cómodo.'],r:'Respiración normal.',x:['Ir muy rápido antes de tener control.'],c:'Mantenés el ritmo sin tropezar.',d:'2 × 30 s',fa:'Caminar marcando el ritmo.',ha:'Más velocidad.',w:'Ojo con el piso irregular.'},

/* ============ UTILIDADES ============ */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.add('hidden'),2600); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lunesDe(fecha){ const d=new Date(fecha); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const hoyIdx = (new Date().getDay()+6)%7;
const semIni = iso(lunesDe(new Date()));
function sesionEn(idx){ const id=Object.keys(S.plan).find(k=>S.plan[k]===idx); return id||'desc'; }
function clave(id, semana=semIni){ return semana+'|'+id; }
function registro(id, semana){ return S.log[clave(id,semana)] || {}; }
function setReg(id, datos){ const k=clave(id); S.log[k]={...registro(id),...datos}; guardar(); }
function fechaDia(idx){ const d=lunesDe(new Date()); d.setDate(d.getDate()+idx); return d.getDate()+'/'+(d.getMonth()+1); }

  if(run){ app.innerHTML = vistaSesion(); }
  else if(vista==='hoy') app.innerHTML = vistaHoy();

/* ---- HOY ---- */
function resumenSemana(){
  const ids = Object.keys(S.plan).filter(id=>S.plan[id]!==undefined);
  const entrenos = ids.filter(id=>SES[id].t!=='d');
  const hechos = entrenos.filter(id=>registro(id,semIni).hecho).length;
  return {total:entrenos.length, hechos, pct: entrenos.length? Math.round(hechos/entrenos.length*100):0};
}
function proximo(){
  for(let i=1;i<=7;i++){
    const idx=(hoyIdx+i)%7; const id=sesionEn(idx);
    if(SES[id].t!=='d' && !registro(id,semIni).hecho) return {id, idx, dias:i};
  }
  return null;
}
function vistaHoy(){
  const id=sesionEn(hoyIdx), s=SES[id], tipo=TIPOS[s.t];
  const r=registro(id,semIni), hecho=!!r.hecho;
  const res=resumenSemana(), pr=proximo();
  const nums = s.ej.length;
  const descanso = s.t==='d';
  return `
  <p class="muted">${DIAS[hoyIdx]} ${fechaDia(hoyIdx)} · semana ${S.semana} de 4</p>
  <h1 class="hero">${descanso?'Hoy <span>descansás</span>':esc(s.nom).replace(/^(\S+)/,'$1 <span>')+'</span>'}</h1>
  ${descanso ? `<div class="card"><h3>Día de descanso</h3><p>${esc(s.obj)} Si querés, podés caminar tranquilo o estirarte un rato. No hace falta sumar sesiones intensas.</p></div>`
  : `<div class="row"><span class="chip ${tipo.c}">${tipo.n}</span><span class="chip c-d">${esc(s.dur)}</span><span class="chip c-d">Esfuerzo ${esc(s.esf.toLowerCase())}</span>${hecho?'<span class="chip c-f" style="background:var(--ok)">Completada</span>':''}</div>
  <p>${esc(s.obj)}</p>
  <h3>Lista de hoy</h3>
  <div class="card">
    ${[ ['Calentamiento',null], ...s.ej.map(e=>[EX[e[0]].n,e[0]]), ['Vuelta a la calma',null] ].map(([t,eid])=>`<div class="check" style="cursor:default"><span aria-hidden="true">${(hecho||(eid&&(r.ex||[]).includes(eid)))?'✅':'⬜'}</span>${esc(t)}</div>`).join('')}
  </div>
  <a class="bigbtn" href="#" id="btnEmpezar" data-start="${id}">${hecho?'VOLVER A VER EL ENTRENAMIENTO':'EMPEZAR ENTRENAMIENTO'}</a>`}
  ${diaHTML(hoyIdx,'Mi día de hoy')}<div class="card"><h3>Mi progreso de la semana</h3>
    <div class="bar" role="progressbar" aria-valuenow="${res.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${res.pct}%"></i></div>
    <p class="muted">${res.hechos} de ${res.total} sesiones completadas</p>
  </div>
  <div class="card"><h3>Próximo entrenamiento</h3>
    ${pr? `<p><b>${esc(SES[pr.id].nom)}</b> · ${DIAS[pr.idx]} a las ${esc(SES[pr.id].hora)}</p>` : '<p class="muted">Ya no hay sesiones pendientes esta semana.</p>'}
  </div>
  <div class="note">Escuchá a tu cuerpo. Si hay dolor agudo, mareo o te falta el aire, parate y avisá a un adulto de confianza.</div>`;
}

function ajustarSeries(sets, tipo){
  if(tipo!=='f') return sets;
  if(S.semana===1) return sets.replace(/^\d+(?= ×)/,'2');
  return sets;
}
function ajusteSemana(tipo){
  if(tipo!=='f') return '';
  if(S.semana===1) return '<div class="note">Semana 1: hacé solo 2 series, enfocate en la técnica.</div>';
  if(S.semana===3) return '<div class="note">Semana 3: si la técnica sale bien, sumá 1 repetición por serie. Cambiá una cosa por vez.</div>';

}

let timerId=null;
document.getElementById('app').addEventListener('click', e=>{
  const el=e.target.closest('[data-act],[data-start]'); if(!el) return;
  if(el.dataset.start){ e.preventDefault(); iniciar(el.dataset.start); return; }
  const a=el.dataset.act;
  if(a==='abrir'){ iniciar(el.dataset.id); }
  else if(a==='salir'){ run=null; render(); }
  else if(a==='next'){ run.paso++; render(); window.scrollTo(0,0); }
  else if(a==='prev'){ if(run.paso>0){ run.paso--; render(); window.scrollTo(0,0);} }
  else if(a==='marcar'){
    const r=registro(run.id,semIni); const ex=new Set(r.ex||[]);
    ex.has(el.dataset.ex)?ex.delete(el.dataset.ex):ex.add(el.dataset.ex);
    setReg(run.id,{ex:[...ex]}); render();
  }
  else if(a==='timer'){ iniciarTimer(+el.dataset.s); }
  else if(a==='terminar'){ terminar(); }
  else if(a==='semana'){ S.semana=+el.dataset.n; guardar(); toast('Semana '+S.semana+' activada'); render(); }
  else if(a==='tema'){ S.tema=el.dataset.t; guardar(); render(); }
  else if(a==='copiar'){ copiar(); }
  else if(a==='borrar'){ if(confirm('¿Seguro que querés borrar todos tus registros? No se puede deshacer.')){ S={...defState,plan:{...DEFAULT_PLAN}}; guardar(); render(); toast('Registros borrados'); } }

});

function iniciar(id){ run={id,paso:0}; render(); window.scrollTo(0,0); }
function terminar(){
  const marcados=registro(run.id,semIni).ex||[];
  if(!marcados.length && !confirm('No marcaste ningún ejercicio. ¿Guardar la sesión igual?')) return;
  const v=n=>document.querySelector(`[data-f="${n}"]`);
  const num=(x,min,max,def)=>{ const n=parseInt(x,10); return isNaN(n)?def:Math.min(max,Math.max(min,n)); };
  const datos={hecho:true, rpe:num(v('rpe').value,1,10,5), eb:num(v('eb').value,1,5,3), ea:num(v('ea').value,1,5,3), tec:num(v('tec').value,1,5,4), reps:Math.max(0,parseInt(v('reps').value,10)||0), molestia:v('molestia').value.trim().slice(0,300), nota:v('nota').value.trim().slice(0,500)};
  const id=run.id; const r=registro(id,semIni);
  setReg(id,datos);
  aplicarProgresion(id);
  run=null; vista='hoy'; render(); window.scrollTo(0,0);
  toast('¡Sesión completada! Buen trabajo 💪');
}
function copiar(){
  const t=document.getElementById('exp'); t.select();
  try{ navigator.clipboard.writeText(t.value).then(()=>toast('Copiado')).catch(()=>{document.execCommand('copy');toast('Copiado');}); }
  catch(err){ try{document.execCommand('copy');toast('Copiado');}catch(e){ toast('Seleccioná el texto y copialo a mano'); } }
}
function iniciarTimer(seg){
  clearInterval(timerId); let t=seg; const out=document.getElementById('tmr');
  const tic=()=>{ if(!out) return clearInterval(timerId); out.textContent = t>0? 'Descanso: '+t+' s' : '¡Listo! Seguí cuando estés listo'; if(t<=0) clearInterval(timerId); t--; };
  tic(); timerId=setInterval(tic,1000);
}

const ALIM={
 fideos:{n:'Fideos cocidos',k:158,p:5.8,c:31,g:0.9,pal:['fideo','tallarin','spaghetti','pasta']},
 carne:{n:'Carne picada',k:215,p:18,c:0,g:15,pal:['carne']},
 tomate:{n:'Tomate / tuco',k:18,p:0.9,c:3.9,g:0.2,pal:['tomate','tuco']},
 aceite:{n:'Aceite',k:884,p:0,c:0,g:100,pal:['aceite']},
 queso:{n:'Queso',k:350,p:25,c:1.3,g:27,pal:['queso']},
 arroz:{n:'Arroz cocido',k:130,p:2.7,c:28,g:0.3,pal:['arroz']},
 pollo:{n:'Pollo cocido',k:165,p:31,c:0,g:3.6,pal:['pollo']},
 pan:{n:'Pan',k:265,p:9,c:49,g:3.2,pal:['pan']},
 leche:{n:'Leche entera',k:61,p:3.2,c:4.8,g:3.3,pal:['leche']},
 huevo:{n:'Huevo',k:143,p:12.6,c:0.7,g:9.5,pal:['huevo']},
 banana:{n:'Banana',k:89,p:1.1,c:23,g:0.3,pal:['banana']}
};
let pendComida=null, pendReceta={nombre:'',ing:[],porciones:4,comi:0};

function detectar(t){ t=t.toLowerCase(); return Object.keys(ALIM).filter(k=>ALIM[k].pal.some(p=>t.includes(p))); }
function nutri(items){
  const tot={k:0,p:0,c:0,g:0}; const sin=[];
  for(const it of items){
    if(!(it.g>0)){ sin.push(ALIM[it.k].n); continue; }
    const f=it.g/100, a=ALIM[it.k];
    tot.k+=a.k*f; tot.p+=a.p*f; tot.c+=a.c*f; tot.g+=a.g*f;
  }
  let precision;
  if(!items.length) precision='Sin datos';
  else if(!sin.length) precision='Aproximada: todas las cantidades cargadas, valores de referencia';
  else precision='Parcial: faltan cantidades de '+sin.join(', ')+'. No se calcularon';
  return {tot,sin,precision};
}

function respuestaIA(m){
  m=m.toLowerCase();
  const s=SES[sesionEn((new Date().getDay()+6)%7)];
  const hechas=Object.entries(S.log).filter(([k,v])=>k.startsWith(semIni+'|')&&v.hecho).map(([k])=>SES[k.split('|')[1]]&&SES[k.split('|')[1]].nom).filter(Boolean);
  if(/hoy|toca/.test(m)) return s.t==='d'?'Hoy es día de descanso según tu calendario. Podés caminar suave o estirarte si te sentís bien.':`Hoy te toca: ${s.nom}, ${s.dur}. Abrilo desde la pestaña Hoy y seguí el paso a paso.`;
  if(/complet|esta semana|hice/.test(m)) return hechas.length?'Esta semana completaste: '+hechas.join(', ')+'.':'Todavía no registraste sesiones completadas esta semana.';
  if(/cans|fatig|dolor|molest/.test(m)) return 'Si estás cansado, hacé la versión más fácil de cada ejercicio, reducí una serie y priorizá la técnica. Si hay dolor agudo, mareo o falta de aire, detenete y avisá a un adulto de confianza.';
  if(/comí|comi|registr|fideo|comida/.test(m)) return 'Escribí lo que comiste en la pestaña Comida. Te voy a pedir las cantidades que falten. Si no las tengo, no calculo nada.';
  if(/proteín|carbohidrat|grasa/.test(m)) return 'Las proteínas ayudan a reparar y construir músculo. Los carbohidratos son la energía principal para moverte. Las grasas también aportan energía y son necesarias para el cuerpo.';
  if(/receta|ingrediente/.test(m)) return 'En Recetas cargá cada ingrediente con sus gramos, cuántas porciones salieron y cuántos gramos comiste. Así calculo tu porción.';
  if(/ejercicio|cómo se hace|no entiendo|técnica/.test(m)) return 'Abrí la ficha del ejercicio en la pestaña Ejercicios. Tiene paso a paso, errores comunes y un enlace de video.';
  return 'No tengo información suficiente para responder eso con seguridad. Podés preguntarme por tu entrenamiento de hoy, tus sesiones de la semana o cómo registrar una comida.';
}

document.getElementById('app').addEventListener('click', e=>{
  const b=e.target.closest('[data-m]'); if(!b) return;
  sync(); const a=b.dataset.m;
  if(a==='analizar'){
    const t=document.getElementById('txtComida').value.trim();
    if(!t){ toast('Escribí qué comiste.'); return; }
    pendComida={texto:t, items:detectar(t).map(k=>({k,g:0}))};
    if(!pendComida.items.length) toast('No reconocí alimentos. Agregalos abajo.');
  }
  else if(a==='agregar'){ if(!pendComida) pendComida={texto:'',items:[]}; pendComida.items.push({k:document.getElementById('selAdd').value,g:0}); }
  else if(a==='quitar'){ pendComida.items.splice(+b.dataset.i,1); }
  else if(a==='guardarComida'){
    if(!pendComida.items.length){ toast('Agregá al menos un alimento.'); return; }
    if(!pendComida.texto) pendComida.texto=pendComida.items.map(x=>ALIM[x.k].n).join(', ');
    const r=nutri(pendComida.items);
    S.comidas=S.comidas||[];
    S.comidas.push({id:Date.now().toString(36),fecha:iso(new Date()),texto:pendComida.texto,items:pendComida.items.map(x=>({k:x.k,g:x.g})),tot:r.tot.k>0?r.tot:null,precision:r.precision});
    pendComida=null; guardar(); toast('Comida guardada');
  }
  else if(a==='borrarComida'){ S.comidas=(S.comidas||[]).filter(c=>c.id!==b.dataset.id); guardar(); }
  else if(a==='rAgregar'){
    const g=parseFloat(document.getElementById('recG').value)||0;
    if(g<=0){ toast('Poné los gramos del ingrediente.'); return; }
    pendReceta.ing.push({k:document.getElementById('recSel').value,g});
  }
  else if(a==='rQuitar'){ pendReceta.ing.splice(+b.dataset.i,1); }
  else if(a==='rGuardar'){
    if(!pendReceta.nombre){ toast('Ponele un nombre a la receta.'); return; }
    if(!pendReceta.ing.length){ toast('Agregá ingredientes.'); return; }
    S.recetas=S.recetas||{}; S.recetas[pendReceta.nombre]={ing:pendReceta.ing.map(x=>({...x})),porciones:pendReceta.porciones||1};
    guardar(); toast('Receta guardada');
  }
  else if(a==='rUsar'){ const r=(S.recetas||{})[b.dataset.n]; if(r) pendReceta={nombre:b.dataset.n,ing:r.ing.map(x=>({...x})),porciones:r.porciones,comi:0}; }
  else if(a==='rBorrar'){ if(S.recetas) delete S.recetas[b.dataset.n]; guardar(); }
  else if(a==='rLimpiar'){ pendReceta={nombre:'',ing:[],porciones:4,comi:0}; }
  else if(a==='ia-enviar'){
    enviarIA(); return;
  }
  else if(a==='ia-limpiar'){ S.chat=[]; guardar(); }
  else return;
  render();
});


/* ============ CHAT CON CLAUDE (vía backend propio) ============ */
let iaBusy=false;
let iaEstado='Verificando la conexión con el servidor…';
function buildContext(){
  const hoyIdx=(new Date().getDay()+6)%7, s=SES[sesionEn(hoyIdx)];
  const hechas=Object.entries(S.log).filter(([k,v])=>k.startsWith(semIni+'|')&&v.hecho).map(([k])=>SES[k.split('|')[1]]&&SES[k.split('|')[1]].nom).filter(Boolean);
  return {
    fechaHoy: iso(new Date()),
    diaSemana: DIAS[hoyIdx],
    semanaPrograma: S.semana,
    sesionHoy: s ? {nombre:s.nom, duracion:s.dur, tipo:(TIPOS[s.t]||{}).n} : null,
    sesionesCompletadasEstaSemana: hechas,
    comidasRecientes: (S.comidas||[]).slice(-5).map(c=>({texto:c.texto, fecha:c.fecha, precision:c.precision, kcalAprox:c.tot?Math.round(c.tot.k):null})),
    recetasGuardadas: Object.keys(S.recetas||{}).slice(0,10),
    agendaHoy: eventosDia(hoyIdx).map(e=>e.ini+'-'+e.fin+' '+e.nom)
  };
}
async function enviarIA(){
  const inp=document.getElementById('iaMsg');
  const msg=((inp&&inp.value)||'').trim();
  if(!msg||iaBusy) return;
  S.chat=(S.chat||[]).concat({r:'u',t:msg}).slice(-40); guardar();
  iaBusy=true; render();
  let texto;
  if(location.protocol==='file:') texto=respuestaIA(msg);
  else try{
    const historial=S.chat.slice(-12).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:historial,context:buildContext()})});
    const data=await res.json().catch(()=>({}));
    if(res.ok&&data.reply) texto=data.reply;
    else if(res.status===503) texto='La IA todavía no está configurada en el servidor. Te respondo con tus datos locales:\n\n'+respuestaIA(msg);
    else texto=(data.error||'No pude obtener respuesta.')+'\n\nTe respondo con tus datos locales:\n\n'+respuestaIA(msg);
  }catch(err){
    texto='Sin conexión con el servidor. Te respondo con tus datos locales:\n\n'+respuestaIA(msg);
  }
  S.chat=(S.chat||[]).concat({r:'a',t:texto}).slice(-40); guardar();
  iaBusy=false; render();
}


/* ============ PROGRESIÓN DE REPETICIONES Y VARIANTE DIFÍCIL ============ */
const PROG_BASE={sent:10,flex:6,remo:10,superman:8,zanc:6,puente:12,fondo:6,triext:8,pajaro:10,bisagra:10,dead:6,elevrod:8,bird:6};
const DIFICIL={
 sent:'Sentadilla búlgara: pie de atrás apoyado en una silla firme, con mochila liviana. Bajá despacio.',
 flex:'Flexiones con los pies elevados en una silla firme.',
 remo:'Remo a una mano con la otra mano apoyada en una silla firme.',
 superman:'Superman con pausa de 3 segundos arriba.',
 zanc:'Zancada con mochila liviana al pecho.',
 puente:'Puente a una pierna, con la cadera nivelada.',
 fondo:'Fondos con los pies estirados adelante y pausa de 2 segundos abajo.',
 triext:'Extensión de tríceps con mochila algo más pesada y pausa de 2 segundos arriba.',
 pajaro:'Pájaro con pausa de 2 segundos con los brazos abiertos.',
 bisagra:'Bisagra a una pierna con mochila liviana.',
 dead:'Dead bug con brazo y pierna contrarios, con pausa de 2 segundos sin apoyar la lumbar.',
 elevrod:'Elevación de rodillas con piernas estiradas al bajar, sin tocar el piso.',
 bird:'Bird-dog con pausa de 3 segundos.'
};
const DIAS_MS=86400000;
function tope(){ return S.tope||12; }
function getProg(id){ S.prog=S.prog||{}; return S.prog[id]||{reps:PROG_BASE[id],listo:0,dificil:false,ultima:null}; }
function objetivo(id){
  const p=getProg(id); let r=p.reps;
  if(p.ultima){ const dias=Math.floor((new Date(iso(new Date()))-new Date(p.ultima))/DIAS_MS); if(dias>10) r=Math.max(PROG_BASE[id],r-2); }
  return Math.min(r, p.dificil?tope():tope());
}
function exActual(id){
  const e=EX[id]; if(!getProg(id).dificil || !DIFICIL[id]) return e;
  return {...e, n:e.n+' (variante difícil)', e:[...e.e,'Variante difícil: '+DIFICIL[id]], fa:'Si perdés la técnica, volvé a la versión base.'};
}
function objetivoHTML(id, sets){
  if(!PROG_BASE[id]) return '';
  const n=parseInt(sets,10)||3, series=S.semana===1?2:n;
  return `<p class="progress-label" style="margin:4px 0">Objetivo de hoy: ${series} series de ${objetivo(id)} repeticiones (tope ${tope()}).${getProg(id).dificil?' Variante difícil.':''}</p>`;
}
function repsFormHTML(sessionId){
  const s=SES[sessionId]; const filas=s.ej.filter(([id])=>PROG_BASE[id]).map(([id])=>
    `<label class="field">${esc(EX[id].n)}: repeticiones logradas en la serie más difícil (buena técnica)<input type="number" min="0" data-rep="${id}" value="${objetivo(id)}"></label>`).join('');
  return filas?`<h3>Repeticiones</h3>${filas}`:'';
}
function aplicarProgresion(sessionId){
  const s=SES[sessionId]; if(!s) return;
  const hoy=iso(new Date());
  S.prog=S.prog||{};
  for(const [eid] of s.ej){
    if(!PROG_BASE[eid]) continue;
    const inp=document.querySelector(`[data-rep="${eid}"]`); if(!inp) continue;
    const logro=parseInt(inp.value,10); if(isNaN(logro)) continue;
    const p=getProg(eid), obj=objetivo(eid);
    let reps=obj, listo=0, dificil=p.dificil;
    if(logro>=obj){
      if(obj<tope()) reps=obj+1;
      else{
        listo=(p.listo||0)+1;
        if(listo>=2 && !dificil){ dificil=true; reps=Math.max(PROG_BASE[eid], tope()-4); listo=0; toast('Pasás a la variante difícil de '+EX[eid].n); }
        else reps=obj;
      }
    } else if(logro<=obj-3){ reps=Math.max(PROG_BASE[eid], obj-2); }
    S.prog[eid]={reps, listo, dificil, ultima:hoy};
  }
  guardar();
}
function progresionHTML(){
  const ids=Object.keys(PROG_BASE);
  return `<div class="card"><h3>Progresión de repeticiones</h3>
  <p class="muted">Si cumplís el objetivo, la próxima vez sumás 1 repetición, hasta el tope. Si llegás al tope dos veces, pasás a la variante difícil. Si hacés más de 10 días sin entrenar, el objetivo baja un poco para volver de forma segura.</p>
  <label class="field">Tope de repeticiones<select data-set="tope">${[10,12,15].map(n=>`<option value="${n}" ${tope()==n?'selected':''}>${n}</option>`).join('')}</select></label>
  <p class="muted">El tope lo elegís vos, junto con tu familia o un profesional de salud. Bajalo si sentís molestias.</p>
  ${ids.map(id=>`<p style="margin:4px 0"><b>${esc(EX[id].n)}</b>: objetivo ${objetivo(id)} repeticiones${getProg(id).dificil?' · variante difícil':''}</p>`).join('')}
  </div>`;
}

  if(e.target.dataset.set==='tope'){ S.tope=+e.target.value; guardar(); render(); }
});

const IGL_DEF={1:{ini:'18:00',fin:'20:00',nom:'Ensayo'},2:{ini:'19:00',fin:'22:00',nom:'Iglesia'},4:{ini:'18:00',fin:'20:00',nom:'Iglesia'},5:{ini:'18:00',fin:'20:00',nom:'Ensayo'},6:{ini:'09:00',fin:'13:00',nom:'Iglesia'}};
// Horarios de entrenamiento que no chocan con escuela ni iglesia
const DEFH={mov:'18:30',fA:'10:30',rec:'18:00',res:'18:30',abd:'20:30',fB:'10:00'};
try{ if(!localStorage.getItem(KEY+'_copia')) localStorage.setItem(KEY+'_copia', localStorage.getItem(KEY)||'{}'); }catch(e){}
if(!S.igl) S.igl=JSON.parse(JSON.stringify(IGL_DEF));
S.extras=S.extras||[]; S.trasl=S.trasl||{escuela:0,iglesia:0}; S.acostar=S.acostar||'22:30'; S.horas=S.horas||{};
Object.keys(DEFH).forEach(k=>{ SES[k].hora=S.horas[k]||DEFH[k]; });
let prop=null;

const mn=h=>{const x=h.split(':');return +x[0]*60+ +x[1];};
const hm=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function durMin(id){return Math.max(...(SES[id].dur.match(/\d+/g)||['20']).map(Number));}
const limite=()=>mn(S.acostar||'22:30')-60; // las sesiones terminan 1 h antes de dormir
function fijos(idx){
  const ev=[], tr=S.trasl||{};
  if(idx<5){
    TALLER.forEach(([i,f,m])=>{const x=m[idx]; if(x) ev.push({ini:i,fin:f,nom:x[0],det:x[1],t:'esc',b:+tr.escuela||0});});
    TARDE.forEach(([i,f],k)=>{const x=MATS[k][idx]; ev.push({ini:i,fin:f,nom:x[0],det:x[1],t:'esc',b:+tr.escuela||0});});
  }
  const g=S.igl&&S.igl[idx]; if(g&&g.ini) ev.push({ini:g.ini,fin:g.fin,nom:g.nom||'Iglesia',t:'igl',b:+tr.iglesia||0});
  (S.extras||[]).filter(e=>e.dia===idx).forEach(e=>ev.push({ini:e.ini,fin:e.fin,nom:e.nom,t:'ext',b:0}));
  return ev;
}
const spans=idx=>fijos(idx).map(e=>[mn(e.ini)-e.b,mn(e.fin)+e.b,e.nom]);
const choca=(o,a,b)=>o.filter(x=>a<x[1]&&b>x[0]);
function ocupado(idx,excl){
  const o=spans(idx);
  Object.keys(S.plan).forEach(id=>{ if(id!==excl&&S.plan[id]===idx&&SES[id]&&SES[id].t!=='d'){const i=mn(SES[id].hora);o.push([i,i+durMin(id),SES[id].nom]);} });
  return o;
}
function conflictos(){
  return Object.keys(S.plan).filter(id=>SES[id]&&SES[id].t!=='d').map(id=>{
    const idx=S.plan[id], a=mn(SES[id].hora);
    return {id,idx,con:choca(spans(idx),a,a+durMin(id)).map(x=>x[2])};
  }).filter(c=>c.con.length);
}
function hueco(idx,id,pref){
  const o=ocupado(idx,id), d=durMin(id), fin=limite(); let best=null,bd=1e9;
  for(let t=480;t+d<=fin;t+=15){ if(!choca(o,t-10,t+d+10).length){ const x=Math.abs(t-pref); if(x<bd){bd=x;best=t;} } }
  return best;
}
// Busca un nuevo lugar: primero el mismo día (si corresponde) y después otro día libre de la semana
function proponer(id,otroDia,desde){
  desde=desde==null?hoyIdx:desde;
  const idx=S.plan[id], s=SES[id], pref=mn(s.hora), fuerte=x=>x!=='desc'&&['f','r'].includes(SES[x].t);
  if(!otroDia){ const t=hueco(idx,id,pref); if(t!=null&&hm(t)!==s.hora) return {id,dia:idx,hora:hm(t)}; }
  for(let d=desde+1;d<7;d++){
    if(d===idx||sesionEn(d)!=='desc') continue;
    if(fuerte(id)&&[d-1,d+1].some(n=>n>=0&&n<7&&sesionEn(n)!==id&&fuerte(sesionEn(n)))) continue;
    const t=hueco(d,id,pref); if(t!=null) return {id,dia:d,hora:hm(t)};
  }
  return null;
}
function eventosDia(idx){
  const ev=fijos(idx).map(e=>({ini:e.ini,fin:e.fin,nom:e.nom,t:e.t,det:e.det}));
  const id=sesionEn(idx); if(SES[id].t!=='d'){const i=mn(SES[id].hora);ev.push({ini:hm(i),fin:hm(i+durMin(id)),nom:'Entrenamiento: '+SES[id].nom,t:'ent'});}
  return ev.sort((a,b)=>mn(a.ini)-mn(b.ini));
}
const ETQ={esc:'Escuela',igl:'Iglesia',ext:'Actividad',ent:'Entreno'};
function diaHTML(idx,titulo){
  const ev=eventosDia(idx);
  return `<div class="card"><h3>${esc(titulo)}</h3>${ev.length?ev.map(e=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span><b>${e.ini}–${e.fin}</b> ${esc(e.nom)}${e.det?`<br><span class="muted">${esc(e.det)}</span>`:''}</span><span class="chip ${e.t==='ent'?'c-f':e.t==='igl'?'c-m':e.t==='esc'?'c-d':'c-v'}">${ETQ[e.t]}</span></div>`).join(''):'<p class="muted">Sin actividades registradas.</p>'}</div>`;
}
function propHTML(){
  if(prop.ninguna) return `<div class="card note danger">No encontré un hueco realista esta semana para «${esc(SES[prop.ninguna].nom)}» sin pisar la escuela, la iglesia o tu hora de dormir. No la recupero acumulando ejercicios. Podés moverla desde Semana o editar su horario más abajo.<br><button class="btn" data-g="cerrar">Entendido</button></div>`;
  const s=SES[prop.id];
  return `<div class="card"><h3>Propuesta</h3><p>Mover <b>${esc(s.nom)}</b> de ${DIAS[S.plan[prop.id]]} ${s.hora} a <b>${DIAS[prop.dia]} ${prop.hora}</b>.</p><p class="muted">No toca la escuela ni la iglesia, respeta tu hora de dormir y no acumula ejercicios. No cambio nada hasta que confirmes.</p><div class="row"><button class="btn ok" data-g="confirmar">Confirmar</button><button class="btn" data-g="cerrar">Cancelar</button></div></div>`;
}
function vistaAgenda(){
  const cf=conflictos().filter(c=>c.idx>=hoyIdx);
  let h=`<h1>Agenda</h1><p class="muted">Horario escolar leído de tu foto y compromisos de iglesia, todo editable.</p>`;
  if(prop) h+=propHTML();
  h+=`<div class="card"><h3>Imprevistos</h3><p class="muted">Si hoy no podés entrenar, busco otro hueco libre de esta semana.</p><button class="btn pri" data-g="hoyNo">No puedo entrenar hoy</button></div>`;
  h+=cf.length?`<div class="card"><h3>Conflictos detectados</h3>${cf.map(c=>`<p><b>${esc(SES[c.id].nom)}</b> (${DIAS[c.idx]} ${SES[c.id].hora}) se superpone con ${esc(c.con.join(', '))}.</p><button class="btn" data-g="buscar" data-id="${c.id}">Buscar otro horario</button>`).join('')}</div>`:'<div class="note">Tus entrenamientos no se superponen con la escuela ni la iglesia.</div>';
  for(let i=0;i<7;i++) h+=diaHTML(i,DIAS[i]+' '+fechaDia(i));
  h+=`<h2 style="margin-top:18px">Iglesia (editable)</h2><div class="card">`+DIAS.map((d,i)=>{const g=(S.igl||{})[i]||{};return `<div class="row" style="margin:8px 0"><b style="width:90px">${d}</b><input type="text" data-in="${i}" value="${esc(g.nom||'')}" placeholder="Nombre" style="width:110px" aria-label="Nombre ${d}"><input type="time" data-ii="${i}" value="${g.ini||''}" style="width:110px" aria-label="Inicio ${d}"><input type="time" data-if="${i}" value="${g.fin||''}" style="width:110px" aria-label="Fin ${d}"><button class="btn" data-g="iglSave" data-d="${i}">Guardar</button></div>`;}).join('')+`<p class="muted">Dejá las horas vacías para quitar un día (por ejemplo, si un día se cancela).</p></div>`;
  h+=`<h2>Agregar actividad</h2><div class="card"><label class="field">Nombre<input type="text" id="exNom" placeholder="Ej: visita, tarea grupal"></label><div class="row"><select id="exDia" aria-label="Día">${DIAS.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><input type="time" id="exIni" aria-label="Inicio"><input type="time" id="exFin" aria-label="Fin"><button class="btn pri" data-g="exAdd">Agregar</button></div>${(S.extras||[]).map(x=>`<div class="row" style="margin-top:8px"><span style="flex:1">${DIAS[x.dia]} ${x.ini}–${x.fin} · ${esc(x.nom)}</span><button class="btn" data-g="exDel" data-id="${x.id}">Quitar</button></div>`).join('')}</div>`;
  h+=`<h2>Horarios de entrenamiento</h2><div class="card">`+Object.keys(DEFH).map(id=>`<div class="row" style="margin:6px 0"><span style="flex:1">${esc(SES[id].nom)} (${DIAS[S.plan[id]]})</span><input type="time" data-h="${id}" value="${SES[id].hora}" style="width:120px" aria-label="Hora de ${esc(SES[id].nom)}"><button class="btn" data-g="hSave" data-id="${id}">Guardar</button></div>`).join('')+`</div>`;
  h+=`<h2>Traslados y descanso</h2><div class="card"><div class="row"><label class="field" style="flex:1">Traslado a la escuela (min)<input type="number" min="0" id="trEsc" value="${(S.trasl||{}).escuela||0}"></label><label class="field" style="flex:1">Traslado a la iglesia (min)<input type="number" min="0" id="trIgl" value="${(S.trasl||{}).iglesia||0}"></label></div><label class="field">Hora de acostarme<input type="time" id="acos" value="${S.acostar||'22:30'}"></label><button class="btn pri" data-g="cfgSave">Guardar</button></div>`;
  return h;
}
document.getElementById('app').addEventListener('click', e=>{
  const b=e.target.closest('[data-g]'); if(!b) return;
  const a=b.dataset.g, q=x=>document.querySelector(x);
  if(a==='hoyNo'){ const id=sesionEn(hoyIdx); if(SES[id].t==='d'){ toast('Hoy no tenés entrenamiento.'); return; } prop=proponer(id,true)||{ninguna:id}; }
  else if(a==='buscar'){ prop=proponer(b.dataset.id,false)||{ninguna:b.dataset.id}; }
  else if(a==='cerrar'){ prop=null; }
  else if(a==='confirmar'){ if(!prop||prop.ninguna) return; S.plan[prop.id]=prop.dia; S.horas[prop.id]=prop.hora; SES[prop.id].hora=prop.hora; guardar(); toast('Cambio aplicado'); prop=null; }
  else if(a==='iglSave'){
    const d=+b.dataset.d, i=q('[data-ii="'+d+'"]').value, f=q('[data-if="'+d+'"]').value, n=q('[data-in="'+d+'"]').value.trim()||'Iglesia';
    if(!i&&!f){ delete S.igl[d]; } else if(!i||!f||mn(i)>=mn(f)){ toast('Revisá la hora de inicio y fin.'); return; } else S.igl[d]={ini:i,fin:f,nom:n};
    guardar(); toast('Guardado');
  }
  else if(a==='exAdd'){
    const nom=q('#exNom').value.trim(), dia=+q('#exDia').value, i=q('#exIni').value, f=q('#exFin').value;
    if(!nom||!i||!f||mn(i)>=mn(f)){ toast('Completá el nombre y horas válidas.'); return; }
    S.extras.push({id:Date.now().toString(36),nom:nom.slice(0,60),dia,ini:i,fin:f}); guardar(); toast('Actividad agregada');
  }
  else if(a==='exDel'){ S.extras=S.extras.filter(x=>x.id!==b.dataset.id); guardar(); }
  else if(a==='hSave'){ const id=b.dataset.id, v=q('[data-h="'+id+'"]').value; if(!v){ toast('Elegí una hora.'); return; } S.horas[id]=v; SES[id].hora=v; guardar(); toast('Guardado'); }
  else if(a==='cfgSave'){ S.trasl={escuela:Math.max(0,parseInt(q('#trEsc').value,10)||0),iglesia:Math.max(0,parseInt(q('#trIgl').value,10)||0)}; S.acostar=q('#acos').value||'22:30'; guardar(); toast('Guardado'); }
  else return;
  render();
});

const fmt=n=>'$ '+Math.round(n).toLocaleString('es-AR');

/* Funciones de cálculo (puras, sin datos del usuario) */
function calcBalance(ing,gas){ return ing-gas; }
function calcPctAhorro(ing,aho){ return ing>0 ? aho/ing*100 : null; }
function calcFaltante(meta,ahorrado){ return Math.max(0, meta-ahorrado); }
function calcAporte(falta,periodos){ return periodos>0 ? falta/periodos : null; }
function calcDescuento(precio,pct){ return {final:precio*(1-pct/100), ahorro:precio*pct/100}; }
function calcCuotas(contado,cuota,n){ const total=cuota*n; return {total, extra:total-contado, pct: contado>0 ? (total-contado)/contado*100 : null}; }
function calcCompuesto(aporte,meses,tasaMes){
  let s=0;
  for(let i=0;i<meses;i++) s=s*(1+tasaMes)+aporte; // el aporte se hace al final de cada mes
  return {final:s, aportado:aporte*meses, interes:s-aporte*meses};
}
function calcPrecioVenta(costo,margenPct){ return costo*(1+margenPct/100); }
function calcComparar(pA,cA,pB,cB){ const uA=pA/cA, uB=pB/cB; return {uA, uB, difPct:(uA-uB)/uB*100}; }

let fSub='presupuesto', fEditId=null, fQuiz={}, fNivelAbierto=0;
function fEnRango(per){
  const hoyS=iso(new Date());
  let a;
  if(per==='semana'){ const d=new Date(); d.setDate(d.getDate()-6); a=iso(d); }
  else a=hoyS.slice(0,8)+'01';
  return S.fin.mov.filter(m=>m.fecha>=a&&m.fecha<=hoyS);
}
function fResumen(lista){
  const sum=t=>lista.filter(m=>m.tipo===t).reduce((a,m)=>a+(+m.monto||0),0);
  const ing=sum('ingreso'), gas=sum('gasto'), aho=sum('ahorro');
  return {ing, gas, aho, disp:ing-gas-aho};
}
function fNivelOk(i){ const L=S.fin.lec[i]||[]; return L.length===FNIV[i].lec.length && (S.fin.quiz[i]||0)>=2; }

function fTarjetaObj(o){
  const falta=calcFaltante(o.meta,o.aho), pct=o.meta>0?Math.min(100,Math.round(o.aho/o.meta*100)):0;
  let plan;
  if(falta<=0) plan='<p><b>¡Llegaste a la meta!</b> Podés crear un objetivo nuevo.</p>';
  else if(o.fec){
    const semanas=Math.ceil((new Date(o.fec+'T00:00:00')-new Date())/(7*864e5));
    plan = semanas<=0 ? '<p class="muted">La fecha límite ya pasó. Podés crear un objetivo nuevo con otro plazo.</p>'
      : `<p>Para llegar a ${esc(o.fec)} tendrías que guardar aprox. <b>${fmt(calcAporte(falta,semanas))} por semana</b> (faltan ${semanas} semanas). Si te resulta mucho, alargá el plazo.</p>`;
  } else plan='<p class="muted">Sin fecha: cualquier monto te acerca. Poné una fecha para calcular un aporte aproximado.</p>';
  return `<div class="card"><h3>${esc(o.nom)}</h3><div class="bar"><i style="width:${pct}%"></i></div>
  <p class="muted">Llevás ${fmt(o.aho)} de ${fmt(o.meta)} (${pct} %) · faltan ${fmt(falta)}</p>${plan}
  <div class="row"><input type="number" id="ap_${esc(o.id)}" min="0" inputmode="decimal" placeholder="Monto a sumar" style="flex:1" aria-label="Monto a sumar"><button class="btn pri" data-fe="objAporte" data-id="${esc(o.id)}">Sumar</button></div>
  <button class="btn" style="margin-top:8px" data-fe="objDel" data-id="${esc(o.id)}">Eliminar objetivo</button></div>`;
}

function fVistaNiveles(){
  let h=`<h2>Recorrido por niveles</h2><p class="muted">Cada nivel tiene lecciones cortas y un repaso. Para pasar al siguiente, leé todas las lecciones y acertá al menos 2 de 3 preguntas. Tu avance queda guardado.</p>`;
  FNIV.forEach((n,i)=>{
    const ok=fNivelOk(i), bloq=i>0&&!fNivelOk(i-1);
    const etiqueta=ok?'Completado':bloq?'Bloqueado':'Disponible';
    h+=`<div class="card"><div class="row" style="justify-content:space-between"><b>Nivel ${i+1}: ${esc(n.n)}</b><span class="chip ${ok?'c-f':bloq?'c-d':'c-v'}" style="${ok?'background:var(--ok)':''}">${etiqueta}</span></div><p class="muted">${esc(n.meta)}</p>`;
    if(bloq){ h+='<p class="muted">Completá el nivel anterior para desbloquearlo.</p></div>'; return; }
    if(fNivelAbierto!==i){ h+=`<button class="btn" data-fe="nivel" data-v="${i}">Abrir nivel</button></div>`; return; }
    const L=S.fin.lec[i]||[], ans=fQuiz[i]||{};
    h+=n.lec.map((x,j)=>`<div class="card" style="margin:8px 0"><b>${esc(x.t)}</b><p>${esc(x.txt)}</p><p class="muted">Ejemplo: ${esc(x.ej)}</p><button class="btn ${L.includes(j)?'ok':''}" data-fe="leccion" data-n="${i}" data-i="${j}">${L.includes(j)?'✔ Leída':'Marcar como leída'}</button></div>`).join('');
    h+=`<h3>Repaso</h3>`+n.quiz.map((q,j)=>`<div class="card" style="margin:8px 0"><p><b>${j+1}. ${esc(q.q)}</b></p>${q.o.map((op,k)=>{
        const contestada=ans[j]!==undefined;
        const estilo=contestada&&k===q.c?'border-color:var(--ok)':'';
        return `<button class="check" data-fe="quiz" data-n="${i}" data-q="${j}" data-o="${k}" ${contestada?'disabled':''} style="${estilo}">${esc(op)}</button>`;
      }).join('')}${ans[j]!==undefined?`<p class="muted">${ans[j]===q.c?'¡Correcto!':'La respuesta correcta es «'+esc(q.o[q.c])+'».'}</p>`:''}</div>`).join('');
    const sc=n.quiz.filter((q,j)=>ans[j]===q.c).length;
    h+=`<p class="muted">Aciertos en este repaso: ${sc} de ${n.quiz.length}</p></div>`;
  });
  return h;
}

    if(fEditId){ const x=S.fin.mov.find(z=>z.id===fEditId); if(x) Object.assign(x,m); }
    else S.fin.mov.push({id:nid(), ...m});
    fEditId=null; guardar(); toast('Movimiento guardado');
  }
  else if(a==='movEditar'){ fEditId=b.dataset.id; }
  else if(a==='movCancelar'){ fEditId=null; }
  else if(a==='movBorrar'){ if(!confirm('¿Borrar este movimiento?')) return; S.fin.mov=S.fin.mov.filter(z=>z.id!==b.dataset.id); guardar(); }
  else if(a==='objNuevo'){
    const nom=val('o_nom').trim(), meta=parseFloat(val('o_meta')), aho=parseFloat(val('o_aho'))||0, fec=val('o_fec');
    if(!nom){ toast('Escribí para qué es el objetivo.'); return; }
    if(!(meta>0)){ toast('Poné cuánto necesitás.'); return; }
    S.fin.obj.push({id:nid(), nom:nom.slice(0,60), meta, aho:Math.max(0,aho), fec}); guardar(); toast('Objetivo creado');
  }
  else if(a==='objAporte'){
    const o=S.fin.obj.find(z=>z.id===b.dataset.id), monto=parseFloat(val('ap_'+b.dataset.id));
    if(!o) return;
    if(!(monto>0)){ toast('Poné un monto mayor a cero.'); return; }
    o.aho=Math.round((o.aho+monto)*100)/100; guardar(); toast('Ahorro sumado');
  }
  else if(a==='objDel'){ if(!confirm('¿Eliminar este objetivo?')) return; S.fin.obj=S.fin.obj.filter(z=>z.id!==b.dataset.id); guardar(); }
  else if(a==='nivel'){ fNivelAbierto=+b.dataset.v; }
  else if(a==='leccion'){
    const n=+b.dataset.n, j=+b.dataset.i, arr=(S.fin.lec[n]||[]).slice(), p=arr.indexOf(j);
    if(p>=0) arr.splice(p,1); else arr.push(j);
    S.fin.lec[n]=arr; guardar();
  }
  else if(a==='quiz'){
    const n=+b.dataset.n, j=+b.dataset.q, o=+b.dataset.o;
    fQuiz[n]=fQuiz[n]||{};
    if(fQuiz[n][j]!==undefined) return;
    fQuiz[n][j]=o;
    const sc=FNIV[n].quiz.filter((q,jj)=>fQuiz[n][jj]===q.c).length;
    S.fin.quiz[n]=Math.max(S.fin.quiz[n]||0, sc); guardar();
  }
  else return;
  render();
});

/* ---- Estudios: prioridad = urgencia × importancia (+2 si es examen) ---- */
function urgencia(t){ if(!t.fecha) return 1; const d=Math.round((new Date(t.fecha)-new Date(iso(new Date())))/864e5); return d<=0?10:d<=1?8:d<=3?5:d<=7?3:1; }
const puntaje=t=>urgencia(t)*t.imp+(t.tipo==='Examen'?2:0);
function ordenadas(){ return S.tareas.filter(t=>!t.hecha).sort((a,b)=>puntaje(b)-puntaje(a)); }
function planEstudio(min){ const out=[]; let r=min; for(const t of ordenadas()){ if(r<=0) break; if(t.min<=r){out.push([t,t.min]);r-=t.min;} else if(r>=15){out.push([t,r]);r=0;} } return out; }

  ['Cuidados generales que ayudan',['Hidratar la piel todos los días con una crema espesa y sin perfume.','Bañarte con agua tibia y en duchas cortas.','Usar limpiadores suaves y sin perfume.','Secarte dando toques con la toalla, sin frotar.','Si la ropa ajustada te molesta en las zonas afectadas, aflojala (consejo general).']],
  ['Pasos para bañarte sin resecar la piel',['Usá agua tibia, no caliente, y duchas cortas.','Limpiá con un jabón suave y sin perfume, pasándolo con la mano, sin frotar con fuerza.','Si usás exfoliante, que sea suave y solo una vez por semana, según las instrucciones del producto.','Salí de la ducha y secate dando toques con la toalla.','Aplicá la crema hidratante enseguida, mientras la piel todavía está húmeda.']],
  ['Por qué hidratar después del baño','La piel pierde agua más rápido cuando está seca, y la sequedad hace más visibles los bultitos. Aplicar la crema sobre la piel húmeda ayuda a retener el agua. La AAD recomienda cremas con urea o ácido láctico para este cuidado.'],
  ['Ingredientes que pueden ayudar',[
    'Urea: es un humectante, retiene agua en la piel. En concentraciones más altas también ayuda a aflojar las células muertas. Precauciones: puede arder si hay heridas o irritación; evitá los ojos.',
    'Ácido láctico: exfolia suavemente y también hidrata. Precauciones: puede picar; aumenta la sensibilidad al sol, así que conviene usar protector; probalo primero en una zona pequeña.',
    'Otros exfoliantes, como el ácido salicílico o el glicólico: aparecen en las guías de la AAD y de Mayo Clinic. Precauciones: pueden irritar; no combinarlos con muchos otros exfoliantes.',
    'Retinoides: la AAD los menciona entre las opciones, pero suelen recetarse. No son una compra libre sin consulta.'
  ]],
  ['Productos que no son imprescindibles',[
    'Un hidratante común sin perfume, o uno con urea o ácido láctico, suele alcanzar. No hace falta comprar varios productos a la vez.',
    'Los cosméticos «anti bultitos» caros no son necesarios para cuidar la piel.',
    'Tratamientos de consultorio, como cremas con corticoides o láser: los evalúa un profesional. El NHS señala que no suelen ofrecerse por el sistema público porque no está demostrado que sean efectivos.'
  ]],
  ['Prácticas que pueden empeorarla',['Frotar con fuerza o usar toallas y esponjas ásperas (la AAD advierte que puede empeorarla).','Rascarte o apretar los bultitos.','Exfoliar más de lo indicado: la AAD sugiere una vez por semana con un exfoliante suave.','Afeitarte o depilarte con cera sobre las zonas afectadas: puede generar más bultitos (AAD).','Baños muy calientes o duchas largas.','Usar autobronceadores: pueden hacer más visibles los bultitos (AAD).']],
  ['Resultados razonables','Los cuidados ayudan a mejorar la textura y la sensación de sequedad, pero no la eliminan por completo. Mayo Clinic señala que los cuidados caseros no la previenen ni la hacen desaparecer. Muchas personas la tienen durante años; en muchos casos mejora con la edad, aunque no siempre.'],
  ['Cuánto puede llevar','Como es una condición de larga duración, suele hacer falta constancia de varias semanas para evaluar si un producto ayuda. No hay un plazo garantizado, y los resultados varían según la piel, la genética y el clima.'],
  ['Cuándo dejar un producto',['Si arde, pica mucho, enrojece o se hincha, dejalo unos días. La AAD recomienda suspender el producto si hay irritación.','Si aparece hinchazón de cara o labios, dificultad para respirar o ronchas que se extienden: buscá atención médica de urgencia.']],
  ['Cuándo consultar',['Con un farmacéutico: si los cuidados básicos no alcanzan y te molesta, puede orientarte sobre cremas con urea o ácido láctico.','Con un médico o dermatólogo: si hay picazón intensa, dolor, sangrado, pus o infección visible, si se extiende mucho, o si querés evaluar tratamientos con receta. El NHS sugiere consultar si lo que probás por tu cuenta no ayuda y te molesta.']],
  ['Fuentes',[
    ['AAD: autocuidado de la queratosis pilaris','https://www.aad.org/public/diseases/a-z/keratosis-pilaris-self-care'],
    ['AAD: opciones de tratamiento','https://www.aad.org/diseases/a-z/keratosis-pilaris-treatment'],
    ['NHS: queratosis pilaris','https://www.nhs.uk/conditions/keratosis-pilaris/'],
    ['Mayo Clinic: manejo de la queratosis pilaris','https://mayoclinic.org/diseases-conditions/keratosis-pilaris/manage/ptc-20168401']
  ]]
 ]},
 {t:'Cuidado corporal',ev:'Consejo general',g:'Cuerpo y cabello',kw:'cuerpo ducha baño transpiración desodorante pliegues hongos',sim:'Bañarte con agua tibia y jabón suave, secarte bien y usar ropa limpia alcanza para la mayoría de las personas.',bloques:[
  ['Qué es','La higiene corporal básica: bañarte, secarte bien y cambiarte la ropa. No hace falta un ritual costoso.'],
  ['Para qué sirve','Prevenir mal olor, irritaciones y hongos en los pliegues, y mantener la piel en buen estado.'],
  ['Pasos',['Bañate con agua tibia (las duchas muy calientes resecan más).','Usá un jabón suave en axilas, pies, ingle y pliegues.','Secate bien, sobre todo entre los dedos y en los pliegues.','Cambiá la ropa interior y las medias todos los días.','Si la piel se siente seca, aplicá una crema hidratante después del baño.']],
  ['Errores que conviene evitar',['Frotar con esponjas ásperas.','Usar perfumes o desodorantes que te irritan: probá con otro producto.','Bañarte con agua muy caliente todos los días si la piel se reseca.']],
  ['Resultados razonables','Piel cómoda y sin irritación si mantenés la higiene básica. Los olores o irritaciones que no se van necesitan revisión.'],
  ['Límites y cuándo consultar','Si aparecen manchas que pican, descamación en los pies o las ingles, o irritación que no pasa, consultá con un farmacéutico o un médico.'],
  ['Fuentes',[]]
 ]},
 {t:'Cabello e higiene personal',ev:'Consejo general',g:'Cuerpo y cabello',kw:'pelo cabello champú shampoo uñas cuero cabelludo toalla peine',sim:'Lavá el cabello según cómo sea tu cuero cabelludo (más seguido si se engrasa, menos si se reseca). Mantené las uñas limpias y cortas.',bloques:[
  ['Qué es','Cuidados simples del cabello (lavado y peinado) y de la higiene personal (uñas, ropa, toallas).'],
  ['Pasos',['Lavá el cabello con un champú suave, masajeando el cuero cabelludo con la yema de los dedos.','Enjuagá bien para que no quede producto.','Acondicionador solo en el largo o las puntas, si lo necesitás.','Secá con toalla sin frotar fuerte y dejá secar al aire cuando puedas.','Cortá las uñas y lavate las manos antes de comer y después de ir al baño.','Cambiá las toallas con regularidad.']],
  ['Errores que conviene evitar',['Lavar el cabello con mucha frecuencia si el cuero cabelludo está muy seco.','Compartir peines, cepillos o toallas.','Usar secadores muy calientes todos los días.']],
  ['Resultados razonables','Cabello limpio y cuero cabelludo cómodo. La textura y el crecimiento dependen mucho de la genética.'],
  ['Límites y cuándo consultar','Si el cuero cabelludo tiene picazón intensa, descamación persistente o se cae mucho el pelo, consultá con un médico o dermatólogo.'],
  ['Fuentes',[]]
 ]},
 {t:'Higiene bucal',ev:'Guía oficial',g:'Higiene bucal',kw:'dientes cepillo pasta dental encías caries hilo dental',sim:'Cepillate dos veces al día durante unos 2 minutos con pasta con flúor. Escupí sin enjuagarte de inmediato, para que el flúor siga actuando.',bloques:[
  ['Qué es','Limpiar los dientes, las encías y la lengua para prevenir caries y problemas de encías.'],
  ['Para qué sirve','Prevenir caries y encías inflamadas. El cepillado no blanquea los dientes ni cambia su forma.'],
  ['Pasos',['Cepillate dos veces al día, unos 2 minutos. Podés usar un temporizador o una canción.','Usá pasta de dientes con flúor.','Cepillá todas las caras de cada diente, con movimientos suaves.','Escupí sin enjuagarte de inmediato, para que el flúor siga actuando.','Limpiá entre los dientes una vez al día (hilo dental o cepillo interdental), según te recomiende tu dentista.']],
  ['Errores que conviene evitar',['Cepillar con mucha fuerza: puede dañar el esmalte y las encías.','Enjuagarte con agua justo después de cepillarte.','Usar productos «blanqueadores» caseros sin consultar.']],
  ['Resultados razonables','Menos caries y encías más sanas con constancia.'],
  ['Límites y cuándo consultar','Si las encías sangran seguido, hay dolor o mal aliento persistente, consultá con un dentista.'],
  ['Fuentes',[['NHS: cómo mantener limpios los dientes','https://www.nhs.uk/live-well/healthy-teeth-and-gums/how-to-keep-your-teeth-clean/']]]
 ]},
 {t:'Protección solar',ev:'Guía oficial',g:'Protección solar',kw:'sol protector solar bloqueador SPF UVA quemadura bronceado',sim:'Usá protector con SPF 30 o más y al menos 4 estrellas de protección UVA, en todas las zonas expuestas. Aplicalo unos 30 minutos antes de salir y reaplicá según el envase.',bloques:[
  ['Qué es','El protector solar reduce la radiación ultravioleta que daña la piel. El SPF mide la protección frente a los rayos UVB; las estrellas (o el símbolo UVA dentro de un círculo) miden la protección frente a los UVA.'],
  ['Para qué sirve','Prevenir quemaduras y el daño acumulado por el sol, que aumenta el riesgo de cáncer de piel con la exposición repetida.'],
  ['Pasos',['Elegí un protector con SPF 30 o más y al menos 4 estrellas de UVA (o el símbolo UVA dentro de un círculo).','Aplicalo en todas las zonas sin ropa: cara, orejas, cuello, pies y dorso de las manos.','Usá una cantidad generosa. La NHS indica unas 6 a 8 cucharaditas para cubrir todo el cuerpo de un adulto.','Aplicalo unos 30 minutos antes de salir al sol.','Reaplicá según indica el envase y después de nadar o transpirar mucho.','Combinalo con sombra, ropa y sombrero: el protector solo no alcanza.']],
  ['Errores que conviene evitar',['Usar muy poca cantidad.','Creer que, por tener protector, podés quedarte más tiempo al sol.','Usar un protector vencido o guardado al sol.']],
  ['Resultados razonables','Protege la piel del daño, pero no broncea. El beneficio se nota a largo plazo, no de un día para otro.'],
  ['Límites y cuándo consultar','Si tenés una lesión en la piel que cambia de forma, color o tamaño, o que no sana, consultá con un médico o dermatólogo.'],
  ['Fuentes',[['NHS: protector solar y seguridad solar','https://www.nhs.uk/live-well/healthy-body/sunscreen-and-sun-safety/']]]
 ]},
 {t:'Sueño y hábitos que influyen en el bienestar',ev:'Guía oficial',g:'Descanso y hábitos',kw:'dormir sueño descanso estrés hábitos bienestar horas',sim:'Dormir entre 8 y 10 horas es lo que recomiendan los CDC para adolescentes de 13 a 18 años. El descanso regular ayuda al bienestar general; sobre la piel, la evidencia es limitada.',bloques:[
  ['Qué es','Un descanso suficiente y regular, junto con otros hábitos simples como comer variado y moverse. El sueño influye en la recuperación general del cuerpo, pero no reemplaza los cuidados de la piel.'],
  ['Pasos',['Elegí una hora fija para acostarte y otra para levantarte, también los fines de semana.','Evitá comidas pesadas y pantallas justo antes de dormir (consejo general).','Si podés, mantené el cuarto oscuro y fresco.','Si el estrés o las dificultades para dormir duran semanas, hablalo con un adulto de confianza o un profesional de salud.']],
  ['Errores que conviene evitar',['Dormir muy poco entre semana y compensar de golpe los fines de semana.','Pensar que un producto puede reemplazar el descanso.']],
  ['Resultados razonables','Más energía y mejor concentración. No hay garantías de cambios en la piel por dormir más.'],
  ['Límites y cuándo consultar','Si dormís mal de forma persistente, te sentís muy cansado todo el tiempo o el estado de ánimo te preocupa, consultá con un profesional de salud.'],
  ['Fuentes',[['CDC: sueño en estudiantes de secundaria','https://archive.cdc.gov/www_cdc_gov/healthyschools/features/students-sleep.htm']]]
 ]},
 {t:'Postura y lenguaje corporal',ev:'Limitada',g:'Descanso y hábitos',kw:'postura lenguaje corporal confianza poses',sim:'Una postura relajada puede ayudarte a sentirte más cómodo al hablar, pero la evidencia de que cambie tus hormonas es débil.',bloques:[
  ['Qué es','Un estudio de 2010 sugirió que las poses de poder cambiaban hormonas y conducta. Una réplica más grande (2015) no encontró ese efecto, aunque sí que la gente decía sentirse más segura.'],
  ['Pasos',['Probá una postura abierta y relajada al hablar y fijate si te sentís más cómodo.']],
  ['Resultados razonables','Quizás más seguridad percibida; no esperes cambios físicos.'],
  ['Límites y cuándo consultar','Una réplica no cierra el debate, y las muestras eran de estudiantes.'],
  ['Fuentes',[['Univ. de Zúrich sobre Ranehill et al. (2015)','https://www.news.uzh.ch/en/articles/2015/posen-der-macht-weniger-maechtig-als-gedacht.html']]]
 ]},
 {t:'Ropa que ya tenés',ev:'Preferencia',g:'Estilo personal',kw:'ropa combinar vestir estilo outfit',sim:'Armar combinaciones con la ropa que ya tenés, limpia y que te quede bien, ahorra tiempo y estrés.',bloques:[

  ['Límites y cuándo consultar','No hay estudios sobre esto: es una preferencia personal.'],
  ['Fuentes',[]]
 ]},
 {t:'Labios secos',ev:'Consejo general',g:'Labios, manos y pies',kw:'labios secos grietas bálsamo manos pies talones',sim:'Un bálsamo labial sin perfume y, si hace falta, una crema para manos y talones suele alcanzar. Evitá morderte o lamerte los labios, porque empeora la sequedad.',bloques:[

  ['Pasos',['Aplicá un bálsamo labial sin perfume varias veces al día.','Después de lavarte las manos, aplicá una crema hidratante sin perfume.','Si tenés grietas en los talones, hidratá de noche y usá medias de algodón.']],

  ['Límites y cuándo consultar','Si hay sangrado, grietas profundas, dolor o infección visible, consultá con un farmacéutico o un médico.'],

 {t:'Afeitado sin irritar la piel',ev:'Consejo general',g:'Afeitado y depilación',kw:'afeitar afeitado navaja rasurar piel irritación',sim:'Afeitarte con espuma o gel, navaja limpia y en la dirección del pelo reduce la irritación. Si se irrita mucho, probá afeitarte con menos frecuencia.',bloques:[

  ['Pasos',['Mojá la piel con agua tibia antes de afeitarte.','Aplicá espuma o gel que ayude a que la navaja se deslice.','Usá una navaja limpia y afeitá en la dirección del pelo.','Enjuagá con agua fría y aplicá una crema hidratante sin perfume.']],
  ['Errores que conviene evitar',['Apretar la navaja contra la piel o pasarla muchas veces por la misma zona.','Compartir navajas.','Afeitarte sobre una piel con cortes o irritación activa.']],
  ['Límites y cuándo consultar','Si aparecen pelos encarnados, infecciones o irritación que no pasa, consultá con un farmacéutico o un dermatólogo.'],
  ['Fuentes',[]]

 {t:'Corte de pelo y barba',ev:'Consejo general',g:'Imagen personal',kw:'corte pelo barba peluquería cuidado personal',sim:'Un corte que se adapte a tu pelo y que puedas mantener, y una barba prolija si la usás, dan una imagen cuidada sin esfuerzo.',bloques:[
  ['Qué es','Elegir un corte y, si querés, una barba que combine con tu cara, tu tipo de pelo y tu rutina. Lo que más se nota es que estén limpios y prolijos.'],
  ['Pasos',['Llevá una foto de un corte que te guste a la peluquería y preguntá si se adapta a tu pelo.','Pedí que te lo ajusten cada 4 a 6 semanas para mantener la forma.','Si tenés barba, recortala con una máquina con peine y mantené los bordes limpios.','Lavá el cabello con un champú adecuado para tu cuero cabelludo y peinalo con poco producto.']],
  ['Errores que conviene evitar',['Copiar un corte que no le queda bien a tu tipo de pelo.','Usar demasiado producto o perfume fuerte.','Cortarte el pelo o la barba en casa sin cuidado, con riesgo de lastimar la piel.']],
  ['Resultados razonables','Una imagen prolija y cómoda. El estilo es personal: no existe un corte correcto para todos.'],
  ['Límites y cuándo consultar','Si tenés caída de pelo, picazón intensa o manchas en el cuero cabelludo, consultá con un médico o un dermatólogo.'],

 ]},
 {t:'Manos rojas e irritadas',ev:'Consejo general',g:'Manos',kw:'manos rojas irritadas resecas dermatitis lavado',sim:'Las manos se enrojecen por el lavado frecuente, el frío, los productos de limpieza y el agua caliente. Con cremas y cuidados simples mejoran en pocos días.',bloques:[
  ['Qué es','Enrojecimiento, y a veces picazón o descamación, en las manos. Suele deberse a lavarse mucho, al frío, a productos de limpieza o al contacto frecuente con agua caliente. Si la piel se irrita por algo que la toca, se llama dermatitis de contacto.'],
  ['Por qué pasa','Lavarse muchas veces saca la grasa natural de la piel. El frío y el aire seco la resecan, y los productos fuertes la irritan más.'],
  ['Pasos',['Lavá las manos con agua tibia y jabón suave, no con agua muy caliente.','Secalas dando toques con una toalla limpia, sin frotar.','Aplicá una crema hidratante espesa y sin perfume varias veces al día, sobre todo después de lavarlas.','Para lavar platos o usar productos de limpieza, usá guantes de goma, y debajo guantes de algodón si podés.','De noche, aplicá una capa generosa de crema; si se resecan mucho, dormí con guantes de algodón.']],
  ['Errores que conviene evitar',['Frotar fuerte o rascar la zona roja.','Usar alcohol en gel todo el día sin cremas, porque reseca.','Poner limón, vinagre u otros productos caseros fuertes sobre la piel irritada.']],
  ['Resultados razonables','Si la irritación es leve, la piel mejora con constancia en unos días. Si no, conviene revisar qué productos usás.'],
  ['Límites y cuándo consultar','Si hay ampollas, ardor fuerte, grietas que sangran, hinchazón o picazón que no pasa en 2 semanas, consultá con un farmacéutico o un dermatólogo.'],
  ['Fuentes',[]]
 ]},
 {t:'Manos moradas o frías',ev:'Consejo general',g:'Manos',kw:'manos moradas violáceas azuladas frías circulación frío',sim:'Las manos pueden verse moradas o azuladas con frío o estrés, porque la circulación en los dedos baja por un momento. Si pasa seguido, conviene consultarlo.',bloques:[
  ['Qué es','Manos que se ven moradas o azuladas, sobre todo con frío o estrés. Muchas veces se debe a que la circulación en los dedos baja por un momento. Cuando pasa rápido y con el calor vuelve a la normalidad, suele ser inofensivo.'],
  ['Qué ayuda',['Abrigarte bien, incluidas las manos, y usar guantes en el frío.','Moverte: mover las manos y los brazos mejora la circulación.','Evitar fumar, porque reduce la circulación en los dedos.','Abrigar también el cuerpo: si todo el cuerpo está frío, las manos se enfrían más.']],
  ['Cuándo consultar','Si las manos se ponen moradas casi siempre, incluso sin frío, o si sentís dolor, adormecimiento, heridas que no cicatrizan o cambios en el color de las uñas, consultá con un médico. Conviene revisarlo.'],
  ['Fuentes',[]]
 ]},
 {t:'Uñas blancas y limpias',ev:'Consejo general',g:'Manos',kw:'uñas blancas manchas limpias cutícula manicura',sim:'Las uñas se mantienen blancas y limpias con limpieza, cortes prolijos y cuidado de las cutículas. Las manchas blancas suelen venir de pequeños golpes.',bloques:[
  ['Qué es','Las uñas blancas suelen referirse a uñas limpias y bien cuidadas, o a pequeñas manchas blancas. Esas manchas suelen venir de golpes chicos o de productos de manicura; no siempre tienen que ver con la salud general.'],
  ['Pasos',['Limpiá debajo de las uñas con un cepillo suave y agua tibia.','Mantenelas cortas y limá los bordes para que no se enganchen.','Usá una crema para cutículas si se resecan.','Si pintás las uñas, usá esmaltes con cuidado y sacalos sin raspar.']],
  ['Errores que conviene evitar',['Morderte las uñas o arrancarte las cutículas.','Usar acetona todos los días.','Raspar las uñas con objetos duros.']],
  ['Límites y cuándo consultar','Si las manchas no crecen, aumentan o las uñas se engrosan, se levantan o cambian de color, consultá con un médico o un dermatólogo: a veces hay hongos.'],
  ['Fuentes',[]]
 ]},
 {t:'Dientes y sonrisa',ev:'Consejo general',g:'Boca y sonrisa',kw:'dientes sonrisa cepillado hilo dental aliento',sim:'Cepillarte bien, usar hilo dental y ir al dentista cada tanto cuidan la sonrisa y el aliento.',bloques:[
  ['Qué es','La higiene bucal cuida los dientes y las encías, y mejora el aliento. Lo que más influye es la rutina diaria.'],
  ['Pasos',['Cepillate los dientes dos veces al día, durante unos dos minutos.','Usá hilo dental o un cepillo interdental una vez al día.','Cambiá el cepillo cuando las cerdas estén gastadas.','Tomá agua durante el día y limitá las bebidas azucaradas.','Visitá al odontólogo al menos una vez al año, o cuando lo indique.']],

 ]},
 {t:'Olor corporal y desodorante',ev:'Consejo general',g:'Higiene diaria',kw:'olor corporal desodorante transpiración baño ropa',sim:'Bañarte a diario, usar desodorante y cambiar la ropa de entrenamiento cuidan el olor corporal.',bloques:[
